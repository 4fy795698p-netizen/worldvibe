<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050505">
<meta name="description" content="WorldVibe - Create, Connect and Discover">
<title>WorldVibe 🌍🎬</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;
 background:#050505;color:#fff;
 font-family:Arial,Helvetica,sans-serif
}
body{overflow:hidden}
button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}

#app{
 width:100%;max-width:720px;height:100vh;
 margin:auto;background:#080808;position:relative;
 overflow:hidden
}

header{
 height:58px;display:flex;align-items:center;
 justify-content:space-between;padding:0 13px;
 border-bottom:1px solid #222;background:#080808;
 position:relative;z-index:20
}
.logo{font-size:21px;font-weight:800}
.header-actions{display:flex;gap:7px}
.header-btn{
 min-width:38px;height:38px;border-radius:20px;
 background:#191919;color:#fff;padding:0 11px
}

main{
 height:calc(100vh - 116px);
 overflow:auto;scrollbar-width:none
}
main::-webkit-scrollbar{display:none}

.bottom-nav{
 height:58px;position:absolute;left:0;right:0;bottom:0;
 z-index:30;display:flex;justify-content:space-around;
 align-items:center;background:#080808;border-top:1px solid #222
}
.nav{
 background:none;color:#777;display:flex;
 flex-direction:column;align-items:center;gap:2px;
 font-size:10px;padding:2px 8px
}
.nav-icon{font-size:21px}
.nav.active{color:#fff}

.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory}
.post{
 height:100%;min-height:520px;position:relative;
 scroll-snap-align:start;background:#111;overflow:hidden
}
.post-media{
 width:100%;height:100%;object-fit:cover;
 position:absolute;inset:0;background:#151515
}
.post-gradient{
 position:absolute;inset:0;
 background:linear-gradient(transparent 35%,rgba(0,0,0,.18) 55%,rgba(0,0,0,.94) 100%);
 pointer-events:none
}
.post-info{
 position:absolute;left:15px;right:78px;bottom:20px;z-index:3
}
.post-user{font-weight:800;font-size:16px}
.post-handle{color:#aaa;font-size:13px;font-weight:400;margin-left:4px}
.post-caption{margin-top:8px;line-height:1.4}
.post-tags{color:#ddd;margin-top:5px}
.post-actions{
 position:absolute;right:9px;bottom:18px;z-index:4;
 display:flex;flex-direction:column;gap:9px
}
.action{
 width:50px;min-height:48px;border-radius:25px;
 background:rgba(0,0,0,.55);color:#fff;
 display:flex;flex-direction:column;
 align-items:center;justify-content:center
}
.action-icon{font-size:21px}
.action-count{font-size:10px;margin-top:2px}

.section{padding:18px 15px}
.section h2{margin:3px 0 15px}
.muted{color:#999;font-size:13px}
.empty{padding:55px 20px;text-align:center;color:#888;line-height:1.6}

.btn{
 background:#fff;color:#000;padding:11px 16px;
 border-radius:10px;font-weight:700
}
.btn.dark{background:#202020;color:#fff}
.btn.red{background:#ff3150;color:#fff}
.btn.green{background:#22c55e;color:#fff}
.btn.blue{background:#2563eb;color:#fff}
.full{width:100%}

.field{
 width:100%;background:#171717;color:#fff;
 border:1px solid #292929;border-radius:10px;
 padding:12px;outline:none
}
.field:focus{border-color:#777}
textarea.field{resize:vertical}

.row{display:flex;gap:9px;align-items:center}
.wrap{flex-wrap:wrap}

.search-box{
 display:flex;gap:8px;padding:13px
}
.search-box .field{flex:1}

.tag-list{display:flex;flex-wrap:wrap;gap:8px}
.tag{
 padding:9px 12px;border-radius:20px;
 background:#181818;color:#fff
}

.grid{
 display:grid;grid-template-columns:repeat(3,1fr);gap:2px
}
.grid-item{
 aspect-ratio:1;background:#171717;overflow:hidden;
 position:relative
}
.grid-item img,.grid-item video{
 width:100%;height:100%;object-fit:cover
}
.grid-play{
 position:absolute;right:6px;top:6px;
 background:rgba(0,0,0,.6);border-radius:50%;
 padding:5px
}

.profile{text-align:center;padding:25px 15px 15px}
.avatar{
 width:92px;height:92px;border-radius:50%;
 object-fit:cover;background:#222;
 display:block;margin:auto;border:2px solid #333
}
.profile h2{margin:12px 0 3px}
.stats{
 display:flex;justify-content:center;gap:35px;margin:18px 0
}
.stat b{display:block;font-size:18px}
.stat span{color:#888;font-size:12px}

.list{display:flex;flex-direction:column;gap:8px}
.list-item{
 padding:14px;border-radius:12px;background:#151515;
 display:flex;align-items:center;justify-content:space-between;
 color:inherit;text-align:left;width:100%
}

.card{
 background:#151515;border:1px solid #252525;
 border-radius:14px;padding:15px;margin-bottom:10px
}

.badge{
 display:inline-block;padding:5px 8px;border-radius:8px;
 background:#242424;font-size:11px;color:#ddd
}

.modal{
 position:absolute;inset:0;z-index:100;
 display:none;align-items:flex-end;
 background:rgba(0,0,0,.78)
}
.modal.show{display:flex}
.sheet{
 width:100%;max-height:92%;overflow:auto;
 background:#111;border-radius:20px 20px 0 0;padding:18px
}
.close{
 float:right;width:34px;height:34px;
 border-radius:50%;background:#242424;
 color:#fff;font-size:20px
}

.preview{
 width:100%;max-height:320px;object-fit:contain;
 background:#050505;border-radius:12px;margin:12px 0
}

.toast{
 position:absolute;left:50%;bottom:72px;
 transform:translateX(-50%);background:#fff;color:#000;
 padding:11px 16px;border-radius:10px;z-index:200;
 display:none;white-space:nowrap;max-width:90%;
 overflow:hidden;text-overflow:ellipsis
}
.toast.show{display:block}

.file-button{
 display:block;text-align:center;width:100%;margin-bottom:12px
}
.file-button input{display:none}

.comment-row{display:flex;gap:8px;margin-top:12px}
.comment-row input{flex:1}

.stat-card{
 flex:1;min-width:100px;
 background:#151515;border-radius:14px;
 padding:15px;text-align:center
}
.stat-card b{font-size:20px;display:block}
.stat-card span{font-size:11px;color:#999}

.coin-box{
 text-align:center;background:#171717;
 border-radius:18px;padding:22px;margin-bottom:12px
}
.coin-number{font-size:34px;font-weight:800}
.money{font-size:30px;font-weight:800}

.divider{height:1px;background:#272727;margin:15px 0}

.spinner{
 width:22px;height:22px;border:3px solid #555;
 border-top-color:#fff;border-radius:50%;
 animation:spin .8s linear infinite;
 margin:auto
}
@keyframes spin{to{transform:rotate(360deg)}}

.light{background:#f5f5f5;color:#111}
.light #app,.light header,.light .bottom-nav{background:#fff;color:#111}
.light header,.light .bottom-nav{border-color:#ddd}
.light .nav{color:#777}
.light .nav.active{color:#111}
.light .field,.light .list-item,.light .tag,
.light .card,.light .stat-card,.light .coin-box{
 background:#f0f0f0;color:#111;border-color:#ddd
}
.light .sheet{background:#fff;color:#111}
.light .header-btn{background:#eee;color:#111}

@media(max-width:430px){
 .logo{font-size:19px}
 .post-info{right:70px}
 .action{width:46px}
 .stats{gap:25px}
}
</style>
</head>

<body>

<div id="app">

<header>
 <div class="logo">WorldVibe 🌍🎬</div>

 <div class="header-actions">
  <button class="header-btn" onclick="openSearch()">🔎</button>
  <button class="header-btn" id="loginHeaderBtn">Login</button>
 </div>
</header>

<main id="main"></main>

<nav class="bottom-nav">

 <button class="nav active" data-tab="home" onclick="go('home')">
  <span class="nav-icon">⌂</span>Home
 </button>

 <button class="nav" data-tab="explore" onclick="go('explore')">
  <span class="nav-icon">◉</span>Explore
 </button>

 <button class="nav" data-tab="create" onclick="openCreate()">
  <span class="nav-icon">＋</span>Create
 </button>

 <button class="nav" data-tab="activity" onclick="go('activity')">
  <span class="nav-icon">♡</span>Activity
 </button>

 <button class="nav" data-tab="profile" onclick="go('profile')">
  <span class="nav-icon">♙</span>Profile
 </button>

</nav>

<div id="toast" class="toast"></div>

<div id="modal" class="modal" onclick="modalOutside(event)">
 <div class="sheet">
  <button class="close" onclick="closeModal()">×</button>
  <div id="sheet"></div>
 </div>
</div>

</div>

<script>

const STORAGE_KEY="WORLDVIBE_V5";

let state=null;
let currentTab="home";
let searchQuery="";
let selectedFile=null;
let selectedAvatarFile=null;
let cloudPostsLoading=false;

function defaultState(){
 return {
  user:{
   uid:"",
   name:"WorldVibe User",
   handle:"@worldvibe_user",
   bio:"Welcome to WorldVibe 🌍🎬",
   avatar:""
  },
  posts:[],
  following:[],
  followers:[],
  activity:[],
  drafts:[],
  savedIds:[],
  settings:{theme:"dark"},
  creator:{
   coins:0,
   earnings:0,
   views:0
  }
 };
}

try{
 state=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
}catch(e){
 state=null;
}

if(!state)state=defaultState();

function save(){
 try{
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
 }catch(e){
  console.log("LOCAL SAVE ERROR",e);
 }
}

function toast(message){
 const el=document.getElementById("toast");
 if(!el)return;
 el.textContent=message;
 el.classList.add("show");
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>el.classList.remove("show"),2400);
}

function escapeHTML(value){
 return String(value??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

function updateNav(){
 document.querySelectorAll(".nav").forEach(b=>{
  b.classList.toggle("active",b.dataset.tab===currentTab);
 });
}

function go(tab){
 currentTab=tab;
 updateNav();
 render();

 if(tab==="home")loadCloudPosts();
}

function render(){
 document.body.classList.toggle(
  "light",
  state.settings.theme==="light"
 );

 updateNav();

 if(currentTab==="home")renderHome();
 else if(currentTab==="explore")renderExplore();
 else if(currentTab==="activity")renderActivity();
 else if(currentTab==="profile")renderProfile();
}

function getPost(id){
 return state.posts.find(p=>p.id===id);
}

function formatNumber(n){
 n=Number(n)||0;
 if(n>=1000000)return (n/1000000).toFixed(1)+"M";
 if(n>=1000)return (n/1000).toFixed(1)+"K";
 return String(n);
}

function avatarHTML(user){
 const src=user?.avatar||"";
 if(src){
  return `<img class="avatar" src="${escapeHTML(src)}" alt="Avatar">`;
 }
 return `<div class="avatar" style="display:grid;place-items:center;font-size:42px">🌍</div>`;
}

/* HOME */

function renderHome(){

 const posts=state.posts.filter(p=>!p.draft);

 if(!posts.length){
  document.getElementById("main").innerHTML=`
   <div class="empty">
    <div style="font-size:60px">🌍🎬</div>
    <h2>Welcome to WorldVibe</h2>
    <p>Create the first post or refresh the cloud feed.</p>
    <button class="btn" onclick="openCreate()">＋ Create Post</button>
    <br><br>
    <button class="btn dark" onclick="loadCloudPosts()">☁️ Load Cloud Posts</button>
   </div>`;
  return;
 }

 document.getElementById("main").innerHTML=
 `<div class="feed">${posts.map(postCard).join("")}</div>`;
}

function postCard(post){

 let media="";

 if(post.src){
  if(post.type==="video"){
   media=`
    <video class="post-media"
     src="${escapeHTML(post.src)}"
     playsinline webkit-playsinline
     autoplay muted loop preload="metadata"
     onclick="toggleVideoSound(this)"></video>`;
  }else{
   media=`
    <img class="post-media"
     src="${escapeHTML(post.src)}"
     alt="WorldVibe post">`;
  }
 }else{
  media=`
   <div class="post-media"
    style="display:grid;place-items:center;font-size:75px">
    🌍🎬
   </div>`;
 }

 const liked=!!post.liked;
 const saved=state.savedIds.includes(post.id);

 return `
 <article class="post">

  ${media}
  <div class="post-gradient"></div>

  <div class="post-info">
   <div class="post-user">
    ${escapeHTML(post.user||"WorldVibe")}
    <span class="post-handle">
     ${escapeHTML(post.handle||"@worldvibe")}
    </span>
   </div>

   <div class="post-caption">
    ${escapeHTML(post.caption||"")}
   </div>

   <div class="post-tags">
    ${escapeHTML(post.tags||"")}
   </div>
  </div>

  <div class="post-actions">

   <button class="action" onclick="likePost('${escapeHTML(post.id)}')">
    <span class="action-icon">${liked?"❤️":"♡"}</span>
    <span class="action-count">${formatNumber(post.likes)}</span>
   </button>

   <button class="action" onclick="comments('${escapeHTML(post.id)}')">
    <span class="action-icon">💬</span>
    <span class="action-count">${formatNumber(post.comments)}</span>
   </button>

   <button class="action" onclick="sharePost('${escapeHTML(post.id)}')">
    <span class="action-icon">↗️</span>
    <span class="action-count">Share</span>
   </button>

   <button class="action" onclick="savePost('${escapeHTML(post.id)}')">
    <span class="action-icon">${saved?"🔖":"📑"}</span>
    <span class="action-count">${saved?"Saved":"Save"}</span>
   </button>

   <button class="action" onclick="postMenu('${escapeHTML(post.id)}')">
    <span class="action-icon">•••</span>
   </button>

  </div>
 </article>`;
}

function toggleVideoSound(video){
 video.muted=!video.muted;
 if(!video.muted)toast("Sound on 🔊");
}

/* CLOUD FEED */

async function loadCloudPosts(){

 if(cloudPostsLoading)return;

 if(!window.firebaseReady){
  return;
 }

 cloudPostsLoading=true;

 try{

  const snap=await window.firebaseGetPosts();

  const cloud=snap.map(data=>({
   id:data.id,
   user:data.user||"WorldVibe User",
   handle:data.handle||"@worldvibe_user",
   caption:data.caption||"",
   tags:data.tags||"#WorldVibe",
   likes:Number(data.likes)||0,
   comments:Number(data.comments)||0,
   views:Number(data.views)||0,
   liked:false,
   saved:false,
   type:data.type||"image",
   src:data.src||"",
   uid:data.uid||"",
   created:data.created||Date.now()
  }));

  const localMap=new Map(state.posts.map(p=>[p.id,p]));

  cloud.forEach(p=>{
   const old=localMap.get(p.id);
   if(old){
    p.liked=!!old.liked;
   }
   localMap.set(p.id,p);
  });

  state.posts=Array.from(localMap.values())
   .sort((a,b)=>(b.created||0)-(a.created||0));

  save();
  render();

 }catch(error){
  console.error(error);
 }finally{
  cloudPostsLoading=false;
 }
}

/* LIKE */

async function likePost(id){

 const post=getPost(id);
 if(!post)return;

 post.liked=!post.liked;
 post.likes=Math.max(0,(post.likes||0)+(post.liked?1:-1));

 if(post.liked){
  state.activity.unshift("You liked a post ❤️");
 }

 save();
 render();

 if(window.firebaseUpdatePost){
  try{
   await window.firebaseUpdatePost(id,{
    likes:post.likes
   });
  }catch(e){
   console.log("Cloud like error",e);
  }
 }
}

/* SAVE */

function savePost(id){

 const index=state.savedIds.indexOf(id);

 if(index>=0){
  state.savedIds.splice(index,1);
  toast("Removed from saved");
 }else{
  state.savedIds.push(id);
  toast("Post saved 🔖");
 }

 save();
 render();
}

/* SHARE */

async function sharePost(id){

 const post=getPost(id);
 if(!post)return;

 const text=`${post.caption||"WorldVibe post"} ${post.tags||""}`;

 try{
  if(navigator.share){
   await navigator.share({
    title:"WorldVibe 🌍🎬",
    text:text,
    url:location.href
   });
  }else if(navigator.clipboard){
   await navigator.clipboard.writeText(text+" "+location.href);
   toast("Post link copied 📋");
  }else{
   toast("Sharing is not supported");
  }
 }catch(e){}
}

/* COMMENTS */

async function comments(id){

 const post=getPost(id);
 if(!post)return;

 document.getElementById("sheet").innerHTML=`
  <h2>Comments 💬</h2>
  <div id="commentList">
   <div class="spinner"></div>
  </div>

  <div class="comment-row">
   <input class="field" id="commentInput"
    placeholder="Write a comment...">
   <button class="btn" onclick="addComment('${escapeHTML(id)}')">
    Post
   </button>
  </div>`;

 openModal();

 if(window.firebaseGetComments){

  try{
   const list=await window.firebaseGetComments(id);

   const box=document.getElementById("commentList");
   if(!box)return;

   if(!list.length){
    box.innerHTML=`<div class="empty">No comments yet.</div>`;
   }else{
    box.innerHTML=list.map(c=>`
     <div class="list-item">
      <div>
       <b>${escapeHTML(c.name||"WorldVibe User")}</b>
       <div class="muted">${escapeHTML(c.text||"")}</div>
      </div>
     </div>`).join("");
   }

  }catch(e){
   console.error(e);
  }

 }else{
  showLocalComments(post);
 }
}

function showLocalComments(post){

 const box=document.getElementById("commentList");
 if(!box)return;

 const list=post.commentList||[];

 box.innerHTML=list.length
 ?list.map(c=>`
   <div class="list-item">
    💬 ${escapeHTML(c)}
   </div>`).join("")
 :`<div class="empty">No comments yet.</div>`;
}

async function addComment(id){

 const input=document.getElementById("commentInput");
 if(!input)return;

 const text=input.value.trim();
 if(!text)return;

 const post=getPost(id);
 if(!post)return;

 if(window.firebaseAuth?.currentUser && window.firebaseAddComment){

  try{

   await window.firebaseAddComment(
    id,
    text,
    state.user.name,
    window.firebaseAuth.currentUser.uid
   );

   post.comments=(post.comments||0)+1;
   save();

   input.value="";
   comments(id);

   if(window.firebaseUpdatePost){
    await window.firebaseUpdatePost(id,{
     comments:post.comments
    });
   }

   return;

  }catch(e){
   console.error(e);
  }
 }

 if(!post.commentList)post.commentList=[];
 post.commentList.push(text);
 post.comments=(post.comments||0)+1;

 save();
 input.value="";
 comments(id);
}

/* POST MENU */

function postMenu(id){

 const post=getPost(id);
 if(!post)return;

 const mine=
 window.firebaseAuth?.currentUser?.uid &&
 post.uid===window.firebaseAuth.currentUser.uid;

 document.getElementById("sheet").innerHTML=`
  <h2>Post options</h2>

  <div class="list">

   <button class="list-item"
    onclick="savePost('${escapeHTML(id)}');closeModal()">
    🔖 Save / Unsave
   </button>

   <button class="list-item"
    onclick="reportPost('${escapeHTML(id)}')">
    🚩 Report
   </button>

   <button class="list-item"
    onclick="toast('Post muted');closeModal()">
    🔇 Mute
   </button>

   ${mine?`
   <button class="list-item"
    style="color:#ff4d68"
    onclick="deletePost('${escapeHTML(id)}')">
    🗑 Delete my post
   </button>`:""}

  </div>`;

 openModal();
}

async function reportPost(id){

 if(window.firebaseReportPost){

  try{
   await window.firebaseReportPost(
    id,
    window.firebaseAuth?.currentUser?.uid||"anonymous"
   );
  }catch(e){}
 }

 toast("Report submitted 🚩");
 closeModal();
}

async function deletePost(id){

 if(!confirm("Delete this post permanently?"))return;

 const post=getPost(id);

 if(window.firebaseDeletePost && post){
  try{
   await window.firebaseDeletePost(id);
  }catch(e){
   toast("Could not delete cloud post");
   return;
  }
 }

 state.posts=state.posts.filter(p=>p.id!==id);
 state.savedIds=state.savedIds.filter(x=>x!==id);

 save();
 closeModal();
 render();

 toast("Post deleted 🗑️");
}

/* EXPLORE */

function renderExplore(){

 const posts=filteredPosts();

 const tags=[
  ...new Set(
   state.posts.flatMap(p=>
    (p.tags||"").split(/\s+/)
    .filter(t=>t.startsWith("#"))
   )
  )
 ].slice(0,40);

 document.getElementById("main").innerHTML=`
  <div class="search-box">
   <input class="field"
    id="searchInput"
    value="${escapeHTML(searchQuery)}"
    placeholder="Search users, posts, hashtags..."
    oninput="searchPosts(this.value)">
   <button class="btn" onclick="searchPosts(document.getElementById('searchInput').value)">
    🔎
   </button>
  </div>

  <div class="section">

   <h2>Trending 🔥</h2>

   <div class="tag-list">
    ${tags.length
    ?tags.map(tag=>`
      <button class="tag"
       onclick="searchPosts('${escapeHTML(tag)}')">
       ${escapeHTML(tag)}
      </button>`).join("")
    :`<span class="muted">Hashtags will appear here.</span>`}
   </div>

   <h2 style="margin-top:25px">
    Discover ${searchQuery?`— "${escapeHTML(searchQuery)}"`:""}
   </h2>

   <div class="grid">
    ${posts.length
    ?posts.map(gridItem).join("")
    :`<div class="empty">Nothing found.</div>`}
   </div>

  </div>`;
}

function gridItem(post){

 if(post.src){
  return `
   <div class="grid-item"
    onclick="openPostFromGrid('${escapeHTML(post.id)}')">
    ${post.type==="video"
    ?`<video src="${escapeHTML(post.src)}" muted></video>
      <span class="grid-play">▶</span>`
    :`<img src="${escapeHTML(post.src)}" alt="Post">`}
   </div>`;
 }

 return `
  <div class="grid-item"
   onclick="openPostFromGrid('${escapeHTML(post.id)}')"

async function publishPost(){

 if(!selectedFile){
  toast("Select a photo or video first");
  return;
 }

 const user=window.firebaseAuth?.currentUser;

 if(!user){
  toast("Please Login first 🔐");
  window.openAuth();
  return;
 }

 const caption=
  document.getElementById("createCaption")?.value.trim()||"";

 const tags=
  document.getElementById("createTags")?.value.trim()||"#WorldVibe";

 const allowComments=
  document.getElementById("allowComments")?.checked!==false;

 if(!window.uploadToFirebaseStorage){
  toast("Firebase Storage is not ready");
  return;
 }

 const cloudURL=
  await window.uploadToFirebaseStorage(selectedFile);

 if(!cloudURL)return;

 const type=
  selectedFile.type.startsWith("video/")
  ?"video":"image";

 const post={
  id:"post_"+Date.now()+"_"+Math.random().toString(36).slice(2,8),
  uid:user.uid,
  user:state.user.name,
  handle:state.user.handle,
  caption:caption||"New WorldVibe post 🎬",
  tags:tags,
  likes:0,
  comments:0,
  views:0,
  type:type,
  src:cloudURL,
  allowComments:allowComments,
  created:Date.now()
 };

 try{

  toast("Saving post to WorldVibe Cloud...");

  await window.firebaseSetPost(
   post.id,
   post
  );

  state.posts.unshift(post);
  state.activity.unshift("Your post was published 🎬");

  save();

  selectedFile=null;
  closeModal();
  currentTab="home";

  render();

  toast("Published successfully ☁️🎬");

 }catch(error){

  console.error(error);

  toast(
   "Publish failed: "+
   (error.code||"Firebase error")
  );
 }
}

window.firebaseLogin=async function(){

 const email=document.getElementById("authEmail")?.value.trim();
 const password=document.getElementById("authPassword")?.value;
 const msg=document.getElementById("authMessage");

 if(!email||!password){
  if(msg)msg.textContent="Enter email and password.";
  return;
 }

 if(!window.firebaseLoginFunction){
  if(msg)msg.textContent="Firebase is still loading...";
  return;
 }

 if(msg)msg.textContent="Logging in...";

 try{

  await window.firebaseLoginFunction(email,password);

  if(msg)msg.textContent="Login successful ✅";

  toast("Welcome to WorldVibe 🌍");

  setTimeout(()=>{
   closeModal();
  },800);

 }catch(error){

  console.error(error);

  let t=error.code||"Login failed";

  if(error.code==="auth/invalid-credential")
   t="Email or password is incorrect.";

  if(error.code==="auth/user-not-found")
   t="No account found.";

  if(error.code==="auth/wrong-password")
   t="Incorrect password.";

  if(error.code==="auth/invalid-email")
   t="Invalid email address.";

  if(error.code==="auth/network-request-failed")
   t="Network error.";

  if(msg)msg.textContent=t;
 }
};

window.firebaseSignup=async function(){

 const email=document.getElementById("authEmail")?.value.trim();
 const password=document.getElementById("authPassword")?.value;
 const msg=document.getElementById("authMessage");

 if(!email||!password){
  if(msg)msg.textContent="Enter email and password.";
  return;
 }

 if(password.length<6){
  if(msg)msg.textContent="Password needs at least 6 characters.";
  return;
 }

 if(!window.firebaseSignupFunction){
  if(msg)msg.textContent="Firebase is still loading...";
  return;
 }

 if(msg)msg.textContent="Creating account...";

 try{

  await window.firebaseSignupFunction(email,password);

  if(msg)msg.textContent="Account created ✅";

  toast("WorldVibe account created 🎉");

  setTimeout(()=>{
   closeModal();
   render();
  },900);

 }catch(error){

  console.error(error);

  let t=error.code||"Signup failed";

  if(error.code==="auth/email-already-in-use")
   t="This email already has an account. Login instead.";

  if(error.code==="auth/invalid-email")
   t="Invalid email address.";

  if(error.code==="auth/weak-password")
   t="Password is too weak.";

  if(msg)msg.textContent=t;
 }
};

  console.error("PROFILE LOAD ERROR",error);
 }
}


/* SAVE PROFILE */

window.saveFirebaseProfile=
async function(){

 const user=auth.currentUser;
 if(!user)return false;

 try{

  await setDoc(
   doc(db,"users",user.uid),
   {
    uid:user.uid,
    email:user.email,
    name:state.user.name,
    handle:state.user.handle,
    bio:state.user.bio,
    avatar:state.user.avatar,
    following:state.following||[],
    followers:state.followers||[],
    updatedAt:new Date().toISOString()
   },
   {merge:true}
  );

  return true;

 }catch(error){

  console.error(error);
  toast("Cloud profile save failed");
  return false;
 }
};

/* STORAGE */

window.uploadToFirebaseStorage=
async function(file){

 const user=auth.currentUser;

 if(!user){
  toast("Please login first 🔐");
  return null;
 }

 try{

  const safe=file.name.replace(
   /[^a-zA-Z0-9._-]/g,
   "_"
  );

  const path=
   "posts/"+user.uid+"/"+
   Date.now()+"_"+safe;

  const storageRef=ref(storage,path);

  toast("Uploading to cloud ☁️...");

  await uploadBytes(storageRef,file);

  const url=await getDownloadURL(storageRef);

  toast("Upload complete ✅");

  return url;

 }catch(error){

  console.error("UPLOAD ERROR",error);

  toast(
   "Storage upload failed: "+
   (error.code||"error")
  );

  return null;
 }
};


/* AVATAR STORAGE */

window.uploadAvatarToFirebase=
async function(file){

 const user=auth.currentUser;

 if(!user)return null;

 try{

  const safe=file.name.replace(
   /[^a-zA-Z0-9._-]/g,
   "_"
  );

  const path=
   "avatars/"+user.uid+"/"+
   Date.now()+"_"+safe;

  const avatarRef=ref(storage,path);

  toast("Uploading profile photo...");

  await uploadBytes(avatarRef,file);

  return await getDownloadURL(avatarRef);

 }catch(error){

  console.error(error);
  toast("Profile photo upload failed");
  return null;
 }
};

/* AUTH STATE */

onAuthStateChanged(
 auth,
 async user=>{

  const button=
   document.getElementById("loginHeaderBtn");

  if(user){

   state.user.uid=user.uid;
   save();

   if(button){
    button.textContent="👤";
    button.title=user.email||"Account";

    button.onclick=()=>{
     accountMenu(user);
    };
   }

   await loadProfile(user);

   if(currentTab==="home"){
    await loadCloudPosts();
   }

  }else{

   if(button){
    button.textContent="Login";
    button.title="Login";

    button.onclick=()=>{
     window.openAuth();
    };
   }

  }

 }
);
