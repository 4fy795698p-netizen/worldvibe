<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050505">
<meta name="description" content="WorldVibe - Short videos. Real people. One world.">
<title>WorldVibe 🌍🎬</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}
body.light{background:#f4f4f4;color:#111}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
.app{max-width:1100px;margin:auto;min-height:100vh}
.top{
 position:sticky;top:0;z-index:20;
 background:rgba(5,5,5,.94);backdrop-filter:blur(15px);
 border-bottom:1px solid #222;
}
body.light .top{background:rgba(255,255,255,.94);border-color:#ddd}
.topbar{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.logo{font-size:21px;font-weight:900}
.logo span{font-size:12px;display:block;color:#aaa;font-weight:500}
.iconbtn{background:#191919;color:#fff;border-radius:50%;width:40px;height:40px}
body.light .iconbtn{background:#e9e9e9;color:#111}
.page{padding:14px 14px 90px}
.card{
 background:#111;border:1px solid #242424;border-radius:18px;padding:15px;margin-bottom:14px
}
body.light .card{background:#fff;border-color:#ddd}
.btn{
 padding:12px 16px;border-radius:12px;background:#222;color:#fff;font-weight:700
}
.btn.blue{background:#1877f2}
.btn.green{background:#16a34a}
.btn.red{background:#dc2626}
.btn.gray{background:#333}
.btn.full{width:100%}
.row{display:flex;gap:10px;align-items:center}
.space{justify-content:space-between}
input,textarea,select{
 width:100%;padding:13px;border-radius:12px;border:1px solid #333;
 background:#171717;color:#fff;outline:none;margin-bottom:10px
}
body.light input,body.light textarea,body.light select{
 background:#fafafa;color:#111;border-color:#ccc
}
textarea{min-height:100px;resize:vertical}
.auth{
 min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px
}
.authbox{width:100%;max-width:430px;background:#111;border:1px solid #292929;border-radius:25px;padding:25px}
.authlogo{text-align:center;font-size:30px;font-weight:900;margin-bottom:6px}
.subtitle{text-align:center;color:#999;margin-bottom:25px}
.authTabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:#191919;padding:5px;border-radius:14px;margin-bottom:20px}
.authTabs button{padding:11px;border-radius:10px;background:transparent;color:#aaa}
.authTabs button.active{background:#fff;color:#111;font-weight:800}
.authPanel{display:none}
.authPanel.active{display:block}
.message{min-height:22px;color:#ff7070;font-size:13px;margin:5px 0 10px}
.nav{
 position:fixed;bottom:0;left:0;right:0;z-index:30;
 background:rgba(5,5,5,.97);border-top:1px solid #292929;
 display:flex;justify-content:center
}
.navinner{width:100%;max-width:1100px;display:grid;grid-template-columns:repeat(7,1fr)}
.nav button{background:none;color:#999;padding:10px 3px;font-size:11px}
.nav button.active{color:#fff}
.nav b{font-size:20px;display:block}
body.light .nav{background:rgba(255,255,255,.97);border-color:#ddd}
body.light .nav button{color:#777}
body.light .nav button.active{color:#111}

.sectionTitle{font-size:22px;font-weight:900;margin:8px 0 15px}
.feedTabs{display:flex;gap:7px;overflow:auto;margin-bottom:14px}
.feedTabs button{white-space:nowrap;background:#181818;color:#aaa;padding:10px 14px;border-radius:20px}
.feedTabs button.active{background:#fff;color:#111;font-weight:800}
body.light .feedTabs button{background:#e5e5e5;color:#555}
body.light .feedTabs button.active{background:#111;color:#fff}

.post{overflow:hidden;padding:0}
.posthead{padding:13px;display:flex;align-items:center;gap:10px}
.avatar{
 width:42px;height:42px;border-radius:50%;background:#333;
 display:flex;align-items:center;justify-content:center;
 overflow:hidden;font-weight:900
}
.avatar img{width:100%;height:100%;object-fit:cover}
.postauthor{font-weight:800}
.posttime{font-size:11px;color:#888}
.followmini{margin-left:auto;background:#1877f2;color:#fff;border-radius:10px;padding:7px 10px;font-size:12px;font-weight:700}
.media{
 width:100%;max-height:720px;min-height:220px;object-fit:cover;background:#000;display:block
}
video.media{aspect-ratio:9/16}
.postbody{padding:12px}
.caption{line-height:1.45;white-space:pre-wrap}
.tags{color:#55aaff;margin-top:8px}
.actions{display:flex;gap:5px;padding-top:10px;border-top:1px solid #242424;margin-top:10px}
.actions button{flex:1;background:transparent;color:#aaa;padding:9px 3px}
.actions button.active{color:#ff426d}
body.light .actions{border-color:#ddd}

.profileHead{display:flex;gap:16px;align-items:center}
.bigavatar{width:90px;height:90px;border-radius:50%;background:#333;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900}
.bigavatar img{width:100%;height:100%;object-fit:cover}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}
.stat{background:#191919;border-radius:14px;text-align:center;padding:12px}
body.light .stat{background:#eee}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:#888}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.griditem{background:#111;border-radius:10px;overflow:hidden;aspect-ratio:9/14}
.griditem video,.griditem img{width:100%;height:100%;object-fit:cover}

.searchbox{position:relative}
.searchbox input{padding-left:42px}
.searchicon{position:absolute;left:14px;top:12px;color:#888}
.result{padding:12px 0;border-bottom:1px solid #292929}

.uploadPreview{max-height:420px;width:100%;object-fit:contain;background:#000;border-radius:15px;margin:10px 0}
.filebox{
 border:2px dashed #444;border-radius:18px;padding:30px 15px;text-align:center;
 color:#aaa
}

.notice{padding:20px;text-align:center;color:#999;background:#171717;border-radius:15px}
body.light .notice{background:#eee}

.future{
 border:1px dashed #555;border-radius:18px;padding:20px;margin-bottom:12px
}
.future h3{margin:0 0 7px}
.future p{color:#999;line-height:1.5;margin-bottom:0}

.toast{
 position:fixed;left:50%;bottom:80px;transform:translateX(-50%);
 background:#fff;color:#111;padding:12px 18px;border-radius:14px;
 z-index:100;font-weight:700;box-shadow:0 5px 30px #0008
}
.modal{
 position:fixed;inset:0;background:#000b;z-index:80;
 display:flex;align-items:flex-end;justify-content:center
}
.modalbox{
 width:100%;max-width:600px;background:#111;border-radius:24px 24px 0 0;
 padding:20px;max-height:85vh;overflow:auto
}
body.light .modalbox{background:#fff}

@media(min-width:700px){
 .page{padding-left:30px;padding-right:30px}
 .nav{left:50%;right:auto;transform:translateX(-50%);width:min(1100px,100%)}
 .navinner{padding:0 20px}
}
</style>
</head>

<body>

<div id="authScreen" class="auth">
<div class="authbox">

<div class="authlogo">WorldVibe 🌍🎬</div>
<div class="subtitle">Short videos. Real people. One world.</div>

<div class="authTabs">
<button id="tabLogin" class="active">Login</button>
<button id="tabSignup">Sign Up</button>
<button id="tabReset">Reset</button>
</div>

<div id="panelLogin" class="authPanel active">
<input id="loginEmail" type="email" placeholder="Email">
<input id="loginPassword" type="password" placeholder="Password">
<div id="loginMsg" class="message"></div>
<button id="loginBtn" class="btn blue full">Login</button>
</div>

<div id="panelSignup" class="authPanel">
<input id="signupName" placeholder="Your name">
<input id="signupEmail" type="email" placeholder="Email">
<input id="signupPassword" type="password" placeholder="Password">
<div id="signupMsg" class="message"></div>
<button id="signupBtn" class="btn blue full">Create Account</button>
</div>

<div id="panelReset" class="authPanel">
<input id="resetEmail" type="email" placeholder="Email">
<div id="resetMsg" class="message"></div>
<button id="resetBtn" class="btn green full">Send Reset Email</button>
</div>

</div>
</div>

<div id="appScreen" class="app hidden">

<header class="top">
<div class="topbar">
<div class="logo">WorldVibe 🌍🎬<span>Real people. One world.</span></div>
<button id="themeBtn" class="iconbtn">☀️</button>
</div>
</header>

<main id="page" class="page"></main>

<nav class="nav">
<div class="navinner">
<button data-page="home" class="active"><b>🏠</b>Home</button>
<button data-page="discover"><b>🔎</b>Discover</button>
<button data-page="create"><b>➕</b>Create</button>
<button data-page="notifications"><b>🔔</b>Alerts</button>
<button data-page="messages"><b>💬</b>Messages</button>
<button data-page="creator"><b>📊</b>Creator</button>
<button data-page="profile"><b>👤</b>Profile</button>
</div>
</nav>

</div>

<div id="modal" class="modal hidden">
<div id="modalBox" class="modalbox"></div>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getAuth,
 onAuthStateChanged,
 signInWithEmailAndPassword,
 createUserWithEmailAndPassword,
 sendPasswordResetEmail,
 signOut,
 updateProfile
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
 getFirestore,
 doc,
 getDoc,
 setDoc,
 updateDoc,
 addDoc,
 collection,
 query,
 orderBy,
 limit,
 getDocs,
 serverTimestamp,
 arrayUnion,
 arrayRemove,
 increment
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
 getStorage,
 ref,
 uploadBytesResumable,
 getDownloadURL
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";


const firebaseConfig={
 apiKey:"AIzaSyArCb63lg3xGMmQ1PYQzeLNN7aw8LxG3A",
 authDomain:"worldvibe-9f531.firebaseapp.com",
 projectId:"worldvibe-9f531",
 storageBucket:"worldvibe-9f531.firebasestorage.app",
 messagingSenderId:"148680723994",
 appId:"1:148680723994:web:c9cf32cd47d7a3ec190ba3",
 measurementId:"G-WZ9G2B2EDP"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const storage=getStorage(app);

const $=id=>document.getElementById(id);

let currentUser=null;
let currentProfile=null;
let posts=[];
let activePage="home";
let activeFeed="latest";
let selectedFile=null;
let selectedMediaURL="";
let editing=false;


/* ---------- HELPERS ---------- */

function escapeHTML(value=""){
 return String(value)
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}

function toast(message){
 $("toast").textContent=message;
 $("toast").classList.remove("hidden");
 clearTimeout(window.__toast);
 window.__toast=setTimeout(()=>$("toast").classList.add("hidden"),2600);
}

function formatCount(n=0){
 n=Number(n)||0;
 if(n>=1000000)return (n/1000000).toFixed(1)+"M";
 if(n>=1000)return (n/1000).toFixed(1)+"K";
 return String(n);
}

function timeAgo(ts){
 if(!ts)return "now";
 const d=ts?.toDate?ts.toDate():new Date(ts);
 const sec=Math.floor((Date.now()-d.getTime())/1000);
 if(sec<60)return sec+"s";
 if(sec<3600)return Math.floor(sec/60)+"m";
 if(sec<86400)return Math.floor(sec/3600)+"h";
 if(sec<604800)return Math.floor(sec/86400)+"d";
 return d.toLocaleDateString();
}

function avatarHTML(name="",url="",big=false){
 const size=big?"bigavatar":"avatar";
 if(url){
  return `<div class="${size}"><img src="${escapeHTML(url)}"></div>`;
 }
 return `<div class="${size}">${escapeHTML((name||"U").charAt(0).toUpperCase())}</div>`;
}

function tagsFromCaption(text=""){
 return [...new Set(
  (text.match(/#[a-zA-Z0-9_]+/g)||[])
 )];
}

function cleanTag(tag){
 return tag.replace(/^#/,"").toLowerCase();
}

function saveLocalDraft(draft){
 const drafts=JSON.parse(localStorage.getItem("worldvibe_drafts")||"[]");
 drafts.unshift({...draft,localId:Date.now()});
 localStorage.setItem("worldvibe_drafts",JSON.stringify(drafts.slice(0,20)));
}

function getDrafts(){
 return JSON.parse(localStorage.getItem("worldvibe_drafts")||"[]");
}

function closeModal(){
 $("modal").classList.add("hidden");
 $("modalBox").innerHTML="";
}


/* ---------- AUTH PANELS ---------- */

function authPanel(name){
 ["login","signup","reset"].forEach(x=>{
  $("panel"+x.charAt(0).toUpperCase()+x.slice(1)).classList.toggle("active",x===name);
  $("tab"+x.charAt(0).toUpperCase()+x.slice(1)).classList.toggle("active",x===name);
 });
}

$("tabLogin").addEventListener("click",()=>authPanel("login"));
$("tabSignup").addEventListener("click",()=>authPanel("signup"));
$("tabReset").addEventListener("click",()=>authPanel("reset"));


/* ---------- AUTH ---------- */

$("loginBtn").addEventListener("click",async()=>{
 const email=$("loginEmail").value.trim();
 const password=$("loginPassword").value;

 $("loginMsg").textContent="";

 if(!email||!password){
  $("loginMsg").textContent="Enter email and password.";
  return;
 }

 try{
  await signInWithEmailAndPassword(auth,email,password);
  toast("Login successful.");
 }catch(e){
  $("loginMsg").textContent=authError(e);
 }
});

$("signupBtn").addEventListener("click",async()=>{
 const name=$("signupName").value.trim();
 const email=$("signupEmail").value.trim();
 const password=$("signupPassword").value;

 $("signupMsg").textContent="";

 if(!name||!email||!password){
  $("signupMsg").textContent="Please fill all fields.";
  return;
 }

 if(password.length<6){
  $("signupMsg").textContent="Password must be at least 6 characters.";
  return;
 }

 try{
  const result=await createUserWithEmailAndPassword(auth,email,password);

  await updateProfile(result.user,{displayName:name});

  await setDoc(doc(db,"users",result.user.uid),{
   uid:result.user.uid,
   name,
   email,
   bio:"",
   avatar:"",
   privacy:"public",
   followersCount:0,
   followingCount:0,
   createdAt:serverTimestamp()
  });

  toast("Account created.");
 }catch(e){
  $("signupMsg").textContent=authError(e);
 }
});

$("resetBtn").addEventListener("click",async()=>{
 const email=$("resetEmail").value.trim();
 $("resetMsg").textContent="";

 if(!email){
  $("resetMsg").textContent="Enter your email.";
  return;
 }

 try{
  await sendPasswordResetEmail(auth,email);
  $("resetMsg").style.color="#40d878";
  $("resetMsg").textContent="Password reset email sent.";
 }catch(e){
  $("resetMsg").textContent=authError(e);
 }
});

function authError(e){
 const code=e?.code||"";
 if(code.includes("invalid-credential"))return "Email or password is incorrect.";
 if(code.includes("email-already-in-use"))return "This email is already registered.";
 if(code.includes("invalid-email"))return "Invalid email.";
 if(code.includes("weak-password"))return "Password is too weak.";
 if(code.includes("network-request-failed"))return "Internet connection problem.";
 return e?.message||"Authentication failed.";
}


/* ---------- PROFILE ---------- */

async function loadProfile(){
 if(!currentUser)return;

 const snap=await getDoc(doc(db,"users",currentUser.uid));

 if(snap.exists()){
  currentProfile={uid:currentUser.uid,...snap.data()};
 }else{
  currentProfile={
   uid:currentUser.uid,
   name:currentUser.displayName||"WorldVibe User",
   email:currentUser.email||"",
   bio:"",
   avatar:"",
   followersCount:0,
   followingCount:0,
   privacy:"public"
  };

  await setDoc(doc(db,"users",currentUser.uid),{
   ...currentProfile,
   createdAt:serverTimestamp()
  });
 }
}


/* ---------- AUTH STATE ---------- */

onAuthStateChanged(auth,async user=>{
 currentUser=user;

 if(user){
  try{
   await loadProfile();
   $("authScreen").classList.add("hidden");
   $("appScreen").classList.remove("hidden");
   await loadPosts();
   showPage("home");
  }catch(e){
   console.error(e);
   toast("Could not load WorldVibe.");
  }
 }else{
  $("authScreen").classList.remove("hidden");
  $("appScreen").classList.add("hidden");
 }
});


/* ---------- POSTS ---------- */

async function loadPosts(){
 posts=[];

 try{
  const q=query(
   collection(db,"posts"),
   orderBy("createdAt","desc"),
   limit(50)
  );

  const snap=await getDocs(q);

  snap.forEach(d=>{
   posts.push({id:d.id,...d.data()});
  });
 }catch(e){
  console.error("Posts:",e);
 }
}

function visiblePosts(){
 let list=[...posts];

 if(activeFeed==="following"){
  const following=currentProfile?.following||[];
  list=list.filter(p=>following.includes(p.uid));
 }

 if(activeFeed==="trending"){
  list.sort((a,b)=>{
   const ea=(a.likesCount||0)+(a.commentsCount||0)*2+(a.viewsCount||0)/100;
   const eb=(b.likesCount||0)+(b.commentsCount||0)*2+(b.viewsCount||0)/100;
   return eb-ea;
  });
 }

 return list;
}

function postCard(post){
 const liked=(post.likedBy||[]).includes(currentUser.uid);
 const saved=(post.savedBy||[]).includes(currentUser.uid);
 const mine=post.uid===currentUser.uid;

 let media="";

 if(post.mediaType==="video"){
  media=`
   <video
    class="media"
    src="${escapeHTML(post.mediaUrl||"")}"
    controls
    playsinline
    preload="metadata"
   ></video>`;
 }else{
  media=`
   <img
    class="media"
    src="${escapeHTML(post.mediaUrl||"")}"
    alt="WorldVibe post"
   >`;
 }

 return `
 <article class="card post" data-post="${post.id}">

  <div class="posthead">
   ${avatarHTML(post.authorName,post.authorAvatar)}
   <div>
    <div class="postauthor">${escapeHTML(post.authorName||"WorldVibe User")}</div>
    <div class="posttime">${timeAgo(post.createdAt)}</div>
   </div>

   ${!mine?`
   <button class="followmini" data-action="follow" data-uid="${post.uid}">
    Follow
   </button>`:""}

  </div>

  ${media}

  <div class="postbody">

   ${post.caption?`
   <div class="caption">${escapeHTML(post.caption)}</div>
   `:""}

   ${post.hashtags?.length?`
   <div class="tags">
    ${post.hashtags.map(t=>"#"+escapeHTML(t)).join(" ")}
   </div>`:""}

   <div class="posttime" style="margin-top:8px">
    👁️ ${formatCount(post.viewsCount||0)} views
   </div>

   <div class="actions">

    <button class="${liked?"active":""}"
      data-action="like"
      data-id="${post.id}">
      ${liked?"❤️":"🤍"} ${formatCount(post.likesCount||0)}
    </button>

    <button data-action="comment" data-id="${post.id}">
      💬 ${formatCount(post.commentsCount||0)}
    </button>

    <button class="${saved?"active":""}"
      data-action="save"
      data-id="${post.id}">
      ${saved?"🔖":"📑"}
    </button>

    <button data-action="share" data-id="${post.id}">
      ↗️
    </button>

    <button data-action="more" data-id="${post.id}">
      ⋯
    </button>

   </div>
  </div>
 </article>`;
}


/* ---------- HOME ---------- */

async function renderHome(){
 const list=visiblePosts();

 $("page").innerHTML=`
 <div class="sectionTitle">For You 🌍</div>

 <div class="feedTabs">
  <button data-feed="latest" class="${activeFeed==="latest"?"active":""}">Latest</button>
  <button data-feed="following" class="${activeFeed==="following"?"active":""}">Following</button>
  <button data-feed="trending" class="${activeFeed==="trending"?"active":""}">🔥 Trending</button>
 </div>

 <div id="feed">
  ${
   list.length
   ?list.map(postCard).join("")
   :`<div class="notice">
      No videos yet.<br><br>
      Be the first person to upload on WorldVibe 🎬
     </div>`
  }
 </div>`;
}


/* ---------- CREATE ---------- */

function renderCreate(){
 const drafts=getDrafts();

 $("page").innerHTML=`
 <div class="sectionTitle">Create 🎬</div>

 <div class="card">

  <div class="filebox" id="fileBox">
   <div style="font-size:40px">🎬</div>
   <b>Select video or photo</b>
   <p>Short videos, photos and future media formats</p>
   <input id="mediaInput" type="file" accept="video/*,image/*">
  </div>

  <div id="preview"></div>

  <textarea id="captionInput"
   placeholder="Write a caption... #WorldVibe"></textarea>

  <select id="privacyInput">
   <option value="public">🌍 Public</option>
   <option value="followers">👥 Followers</option>
   <option value="private">🔒 Private</option>
  </select>

  <div id="uploadStatus" class="posttime"></div>

  <div class="row">
   <button id="draftBtn" class="btn gray" style="flex:1">
    Save Draft
   </button>
   <button id="publishBtn" class="btn blue" style="flex:2">
    Publish 🎬
   </button>
  </div>

 </div>

 <div class="card">
  <b>Future Creator Tools</b>
  <p class="posttime">
   Music • Effects • Filters • Text • Stickers • Video trimming
  </p>
 </div>

 ${drafts.length?`
 <div class="sectionTitle">Drafts</div>
 ${drafts.map(d=>`
  <div class="card">
   <b>${escapeHTML(d.caption||"Untitled draft")}</b>
   <div class="posttime">${new Date(d.date||Date.now()).toLocaleString()}</div>
  </div>`).join("")}
 `:""}`;
}


/* ---------- FILE SELECTION ---------- */

function setupCreateEvents(){
 const input=$("mediaInput");
 if(!input)return;

 input.addEventListener("change",()=>{
  selectedFile=input.files?.[0]||null;

  if(!selectedFile)return;

  const url=URL.createObjectURL(selectedFile);
  selectedMediaURL=url;

  const preview=$("preview");

  if(selectedFile.type.startsWith("video")){
   preview.innerHTML=`
    <video class="uploadPreview" src="${url}" controls playsinline></video>`;
  }else{
   preview.innerHTML=`
    <img class="uploadPreview" src="${url}">`;
  }
 });

 $("draftBtn").addEventListener("click",()=>{
  const caption=$("captionInput").value.trim();

  saveLocalDraft({
   caption,
   privacy:$("privacyInput").value,
   date:new Date().toISOString()
  });

/* ---------- UPLOAD ---------- */

async function uploadFile(file,path){
 return new Promise((resolve,reject)=>{
  const storageRef=ref(storage,path);

  const task=uploadBytesResumable(storageRef,file);

  task.on(
   "state_changed",
   snap=>{
    const pct=Math.round(
     snap.bytesTransferred/snap.totalBytes*100
    );

    $("uploadStatus").textContent="Uploading "+pct+"%";
   },
   reject,
   async()=>{
    try{
     resolve(await getDownloadURL(task.snapshot.ref));
    }catch(e){
     reject(e);
    }
   }
  );
 });
}

async function publishPost(){

 if(!selectedFile){

  const path=
   `posts/${currentUser.uid}/${Date.now()}_${safeName}`;

  const url=await uploadFile(selectedFile,path);

  const hashtags=tagsFromCaption(caption)
   .map(cleanTag);

  const mediaType=selectedFile.type.startsWith("video")
   ?"video":"image";

  await addDoc(collection(db,"posts"),{
   uid:currentUser.uid,
   authorName:currentProfile.name||currentUser.displayName||"WorldVibe User",
   authorAvatar:currentProfile.avatar||"",
   mediaUrl:url,

   hashtags,
   likesCount:0,
   commentsCount:0,
   savesCount:0,
   viewsCount:0,
   likedBy:[],
   savedBy:[],

  });

  selectedMediaURL="";

}


/* ---------- LIKE ---------- */

async function likePost(id){

 const post=posts.find(p=>p.id===id);
 if(!post)return;

 const liked=(post.likedBy||[]).includes(currentUser.uid);

 try{

  if(liked){

   await updateDoc(doc(db,"posts",id),{
    likedBy:arrayRemove(currentUser.uid),
    likesCount:increment(-1)
   });

  }else{

   await updateDoc(doc(db,"posts",id),{
    likedBy:arrayUnion(currentUser.uid),
    likesCount:increment(1)
   });

   if(post.uid!==currentUser.uid){
    await addDoc(collection(db,"notifications"),{
     uid:post.uid,
     fromUid:currentUser.uid,
     type:"like",
     postId:id,
     createdAt:serverTimestamp(),
     read:false
    });
   }
  }

  await loadPosts();
  renderCurrent();

 }catch(e){
  console.error(e);
  toast("Like failed.");
 }
}

function popularTags(){

 const count={};

 posts.forEach(p=>{
  (p.hashtags||[]).forEach(t=>{
   count[t]=(count[t]||0)+1;
  });
 });

 return Object.entries(count)
  .sort((a,b)=>b[1]-a[1])
  .slice(0,15)
  .map(x=>x[0]);
}

function searchContent(term){

 term=term.trim().toLowerCase();

 const box=$("searchResults");
 if(!box)return;

 if(!term){
  box.innerHTML="";
  return;
 }

 const results=posts.filter(p=>
  (p.caption||"").toLowerCase().includes(term)||
  (p.authorName||"").toLowerCase().includes(term)||
  (p.hashtags||[]).some(t=>t.includes(term.replace("#","")))
 );

 box.innerHTML=results.length
  ?results.map(postCard).join("")
  :`<div class="notice">No results found.</div>`;
}

/* ---------- VIDEO AUTOPLAY ---------- */

const videoObserver=new IntersectionObserver(entries=>{
 entries.forEach(entry=>{
  const video=entry.target;

  if(entry.isIntersecting){
   video.play().catch(()=>{});
  }else{
   video.pause();
  }
 });
},{threshold:.65});

function observeVideos(){

 document.querySelectorAll("video.media").forEach(video=>{
  videoObserver.observe(video);
 });
}
