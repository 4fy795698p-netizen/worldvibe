const cfg={apiKey:"AIzaSyArCb63lgx3tGMm1QPYQzeLNN7awL8Gx3A",authDomain:"worldvibe-9f531.firebaseapp.com",projectId:"worldvibe-9f531",storageBucket:"worldvibe-9f531.firebasestorage.app",messagingSenderId:"148680723994",appId:"1:148680723994:web:c9cf32cd47d7a3ec190ba3",measurementId:"G-WZ9G2B2EDP"};const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),storage=getStorage(app);let user=null,profile=null,mode='login',postForComment=null;const MAX=200*1024*1024;const $=x=>document.getElementById(x);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function toast(x){$('toast').textContent=x;$('toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',2800)}function openModal(x){$(x).classList.add('show')}function closeModal(x){$(x).classList.remove('show')}function openPage(x){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$(x).classList.add('active');if(x==='home')loadFeed('latest');if(x==='profile')renderProfile();if(x==='creator')creator();if(x==='notifications')notifications()}window.openPage=openPage;window.closeModal=closeModal;
function toggleAuth(){mode=mode==='login'?'signup':'login';$('authTitle').textContent=mode==='login'?'Login':'Create account';$('authName').style.display=mode==='login'?'none':'block'}window.toggleAuth=toggleAuth;
async function authSubmit(){let e=$('authEmail').value.trim(),p=$('authPassword').value;if(!e||!p)return toast('Email and password required.');try{if(mode==='signup'){if(p.length<6)return toast('Password must be at least 6 characters.');let c=await createUserWithEmailAndPassword(auth,e,p);await setDoc(doc(db,'users',c.user.uid),{uid:c.user.uid,name:$('authName').value.trim()||e.split('@')[0],username:e.split('@')[0].toLowerCase(),bio:'',avatar:'',createdAt:serverTimestamp()},{merge:true});toast('Account created ✅')}else{await signInWithEmailAndPassword(auth,e,p);toast('Login successful ✅')}closeModal('authModal')}catch(x){toast(x.message)}}window.authSubmit=authSubmit;

onAuthStateChanged(auth,async u=>{user=u;profile=null;if(u){let s=await getDoc(doc(db,'users',u.uid));profile=s.exists()?s.data():{uid:u.uid,name:u.email.split('@')[0],username:u.email.split('@')[0]};await setDoc(doc(db,'users',u.uid),profile,{merge:true});$('headerAccount').textContent='Profile';$('loginUpload').style.display='none';$('uploadArea').style.display='block'}else{$('headerAccount').textContent='Login';$('loginUpload').style.display='block';$('uploadArea').style.display='none'}renderProfile();loadFeed('latest')});
$('mediaFile').addEventListener('change',e=>{let f=e.target.files[0];$('vprev').style.display='none';$('iprev').style.display='none';if(!f)return;if(f.size>MAX){toast('File is larger than 200 MB.');e.target.value='';return}let u=URL.createObjectURL(f);if(f.type.startsWith('video/')){$('vprev').src=u;$('vprev').style.display='block'}else if(f.type.startsWith('image/')){$('iprev').src=u;$('iprev').style.display='block'}else{toast('Only video or image files are allowed.');e.target.value=''}});
async function publishPost(){if(!user)return openModal('authModal');let f=$('mediaFile').files[0];if(!f)return toast('Select a video or image.');if(f.size>MAX)return toast('Maximum size is 200 MB.');if(!f.type.startsWith('video/')&&!f.type.startsWith('image/'))return toast('Invalid media type.');let b=$('publishBtn');b.disabled=true;try{let ext=(f.name.split('.').pop()||'bin').toLowerCase(),path=`posts/${user.uid}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`,task=uploadBytesResumable(ref(storage,path),f,{contentType:f.type});let url=await new Promise((res,rej)=>task.on('state_changed',s=>b.textContent=`Uploading ${Math.round(s.bytesTransferred/s.totalBytes*100)}%`,rej,async()=>res(await getDownloadURL(task.snapshot.ref))));let tags=$('hashtags').value.split(/[\s,]+/).map(x=>x.replace(/^#/,'').toLowerCase()).filter(Boolean).slice(0,30);await addDoc(collection(db,'posts'),{uid:user.uid,userName:profile?.name||'WorldVibe User',username:profile?.username||'',avatar:profile?.avatar||'',caption:$('caption').value.trim(),hashtags:tags,privacy:$('privacy').value,mediaUrl:url,mediaType:f.type.startsWith('video/')?'video':'image',storagePath:path,createdAt:serverTimestamp(),likesCount:0,commentsCount:0,viewsCount:0});$('mediaFile').value='';$('caption').value='';$('hashtags').value='';$('vprev').style.display='none';$('iprev').style.display='none';toast('Published successfully ✅');openPage('home')}catch(x){toast('Upload failed: '+x.message)}finally{b.disabled=false;b.textContent='Publish'}}window.publishPost=publishPost;
async function loadFeed(type='latest'){let box=$('feed');box.innerHTML='<div class="notice">Loading...</div>';try{let q=query(collection(db,'posts'),where('privacy','==','public'),limit(50));let s=await getDocs(q),a=s.docs.map(d=>({id:d.id,...d.data()}));a.sort((x,y)=>(y.createdAt?.seconds||0)-(x.createdAt?.seconds||0));if(type==='trending')a.sort((x,y)=>(y.likesCount||0)+(y.viewsCount||0)-(x.likesCount||0)-(x.viewsCount||0));box.innerHTML=a.length?a.map(postCard).join(''):'<div class="notice">No public videos yet. Be the first to publish! 🎬</div>'}catch(x){box.innerHTML='<div class="notice">Feed could not load. Check Firebase Firestore rules/indexes.</div>'}}window.loadFeed=loadFeed;
function postCard(p){let m=p.mediaType==='video'?`<video class="postmedia" src="${esc(p.mediaUrl)}" controls playsinline onplay="viewPost('${p.id}')"></video>`:`<img class="postmedia" src="${esc(p.mediaUrl)}">`;return `<article class="card"><div class="posthead"><img class="avatar" src="${esc(p.avatar||'')}"><div style="flex:1"><b>${esc(p.userName||'WorldVibe User')}</b><div class="muted">@${esc(p.username||'user')}</div></div>${user&&user.uid===p.uid?`<button class="danger" onclick="deletePost('${p.id}','${esc(p.storagePath||'')}')">Delete</button>`:''}</div>${m}<div class="postbody">${esc(p.caption||'')}<div class="actions"><button onclick="likePost('${p.id}')">♡ ${p.likesCount||0}</button><button onclick="openComments('${p.id}')">💬 ${p.commentsCount||0}</button><button onclick="savePost('${p.id}')">🔖 Save</button><button onclick="sharePost('${p.id}')">↗ Share</button>${user&&user.uid!==p.uid?`<button onclick="reportPost('${p.id}')">Report</button>`:''}</div></div></article>`}

async function likePost(id){if(!user)return openModal('authModal');try{let l=doc(db,'posts',id,'likes',user.uid),s=await getDoc(l);if(s.exists()){await deleteDoc(l);await updateDoc(doc(db,'posts',id),{likesCount:increment(-1)})}else{await setDoc(l,{uid:user.uid,createdAt:serverTimestamp()});await updateDoc(doc(db,'posts',id),{likesCount:increment(1)})}loadFeed('latest')}catch(x){toast(x.message)}}window.likePost=likePost;
async function savePost(id){if(!user)return openModal('authModal');try{let d=doc(db,'users',user.uid,'saved',id),s=await getDoc(d);if(s.exists()){await deleteDoc(d);toast('Removed from saved')}else{await setDoc(d,{postId:id,createdAt:serverTimestamp()});toast('Saved ✅')}}catch(x){toast(x.message)}}window.savePost=savePost;async function sharePost(id){try{await navigator.clipboard.writeText(location.href.split('#')[0]+'#post-'+id);toast('Link copied ✅')}catch{toast('Share link: '+location.href.split('#')[0]+'#post-'+id)}}window.sharePost=sharePost;

async function openComments(id){if(!user)return openModal('authModal');postForComment=id;openModal('commentModal');$('comments').innerHTML='<div class="notice">Loading...</div>';try{let s=await getDocs(query(collection(db,'posts',id,'comments'),orderBy('createdAt','desc'),limit(100)));$('comments').innerHTML=s.docs.length?s.docs.map(d=>`<div class="notice"><b>${esc(d.data().name||'User')}</b><br>${esc(d.data().text||'')}</div>`).join(''):'<div class="notice">No comments yet.</div>'}catch{$('comments').innerHTML='<div class="notice">Comments unavailable.</div>'}}window.openComments=openComments;async function addComment(){if(!user)return openModal('authModal');let t=$('commentText').value.trim();if(!t)return;try{await addDoc(collection(db,'posts',postForComment,'comments'),{uid:user.uid,name:profile?.name||'User',text:t,createdAt:serverTimestamp()});await updateDoc(doc(db,'posts',postForComment),{commentsCount:increment(1)});$('commentText').value='';openComments(postForComment)}catch(x){toast(x.message)}}window.addComment=addComment;
async function renderProfile(){let b=$('profileContent');if(!user){b.innerHTML='<h2>Your Profile</h2><div class="notice">Login or create an account to continue.</div><button class="btn" onclick="openModal(\'authModal\')">Login / Sign Up</button>';return}if(!profile){b.innerHTML='<div class="notice">Loading profile...</div>';return}let s=await getDocs(query(collection(db,'posts'),where('uid','==',user.uid),limit(100)));b.innerHTML=`<div class="hero"><div style="display:flex;gap:14px;align-items:center"><img class="avatar" style="width:78px;height:78px" src="${esc(profile.avatar||'')}"><div><h2 style="margin:0">${esc(profile.name||'User')}</h2><div class="muted">@${esc(profile.username||'user')}</div></div></div><p>${esc(profile.bio||'')}</p><button class="btn secondary" onclick="editProfile()">Edit</button> <button class="btn danger" onclick="logout()">Logout</button></div><div class="grid"><div class="stat"><b>${s.size}</b>Videos</div><div class="stat"><b>0</b>Followers</div><div class="stat"><b>0</b>Following</div></div><h3>Your Videos</h3>${s.docs.map(d=>postCard({id:d.id,...d.data()})).join('')||'<div class="notice">Your videos will appear here.</div>'}`}
function editProfile(){if(!user)return openModal('authModal');$('pname').value=profile?.name||'';$('pusername').value=profile?.username||'';$('pbio').value=profile?.bio||'';openModal('editModal')}window.editProfile=editProfile;async function saveProfile(){if(!user)return;try{let avatar=profile?.avatar||'',f=$('pavatar').files[0];if(f){if(!f.type.startsWith('image/')||f.size>10*1024*1024)return toast('Photo must be an image under 10 MB.');let r=ref(storage,`profiles/${user.uid}/avatar`),t=uploadBytesResumable(r,f,{contentType:f.type});await new Promise((res,rej)=>t.on('state_changed',()=>{},rej,res));avatar=await getDownloadURL(r)}let d={uid:user.uid,name:$('pname').value.trim()||'WorldVibe User',username:$('pusername').value.trim().replace(/^@/,'').toLowerCase(),bio:$('pbio').value.trim(),avatar,updatedAt:serverTimestamp()};await setDoc(doc(db,'users',user.uid),d,{merge:true});profile={...profile,...d};closeModal('editModal');toast('Profile saved ✅');renderProfile()}catch(x){toast(x.message)}}window.saveProfile=saveProfile;

function toggleTheme(){const n=document.body.classList.contains('light')?'dark':'light';localStorage.setItem('worldvibe_theme',n);applyTheme();toast(n==='light'?'Light mode enabled':'Dark mode enabled')}
window.toggleTheme=toggleTheme;applyTheme();

async function followUser(uid){if(!user)return openModal('authModal');if(uid===user.uid)return toast('You cannot follow yourself.');try{const r=doc(db,'users',user.uid,'following',uid);const s=await getDoc(r);if(s.exists()){await deleteDoc(r);await updateDoc(doc(db,'users',uid),{followersCount:increment(-1)}).catch(()=>{});toast('Unfollowed')}else{await setDoc(r,{uid,createdAt:serverTimestamp()});await updateDoc(doc(db,'users',uid),{followersCount:increment(1)}).catch(()=>{});toast('Following ✅')}}catch(e){toast(e.message)}renderProfile()}
window.followUser=followUser;
async function isFollowing(uid){if(!user||uid===user.uid)return false;try{return (await getDoc(doc(db,'users',user.uid,'following',uid))).exists()}catch{return false}}
async function followCounts(uid){try{const u=await getDoc(doc(db,'users',uid));return {followers:u.data()?.followersCount||0,following:u.data()?.followingCount||0}}catch{return {followers:0,following:0}}}
async function loadFollowingIds(){if(!user)return [];try{const s=await getDocs(collection(db,'users',user.uid,'following'));return s.docs.map(d=>d.id)}catch{return []}}

const originalLoadFeed=loadFeed;
async function loadFeedEnhanced(type='latest'){if(type!=='following')return originalLoadFeed(type);if(!user)return openModal('authModal');const box=$('feed');box.innerHTML='<div class="notice">Loading Following...</div>';try{const ids=await loadFollowingIds();if(!ids.length){box.innerHTML='<div class="empty">Follow creators to see their videos here. 👥</div>';return}const s=await getDocs(query(collection(db,'posts'),where('privacy','==','public'),limit(100)));let a=s.docs.map(d=>({id:d.id,...d.data()})).filter(p=>ids.includes(p.uid));a.sort((x,y)=>(y.createdAt?.seconds||0)-(x.createdAt?.seconds||0));box.innerHTML=a.length?a.map(postCard).join(''):'<div class="empty">Creators you follow have not posted publicly yet.</div>'}catch(e){box.innerHTML='<div class="notice">Following feed could not load: '+esc(e.message)+'</div>'}}
window.loadFeed=loadFeedEnhanced;

const originalRenderProfile=renderProfile;
async function renderProfileEnhanced(){if(!user)return originalRenderProfile();let b=$('profileContent');if(!profile)return originalRenderProfile();try{const s=await getDocs(query(collection(db,'posts'),where('uid','==',user.uid),limit(100)));const counts=await followCounts(user.uid);b.innerHTML=`<div class="hero"><div style="display:flex;gap:14px;align-items:center"><img class="avatar" style="width:78px;height:78px" src="${esc(profile.avatar||'')}" onerror="this.style.visibility='hidden'"><div><h2 style="margin:0">${esc(profile.name||'User')}</h2><div class="muted">@${esc(profile.username||'user')}</div></div></div><p>${esc(profile.bio||'')}</p><button class="btn secondary" onclick="editProfile()">Edit</button> <button class="btn secondary" onclick="openPage('creator')">Creator Center</button> <button class="btn secondary" onclick="openPage('settings')">Settings</button></div><div class="grid"><div class="stat"><b>${s.size}</b>Videos</div><div class="stat"><b>${counts.followers}</b>Followers</div><div class="stat"><b>${counts.following}</b>Following</div></div><h3>Your Videos</h3>${s.docs.map(d=>postCard({id:d.id,...d.data()})).join('')||'<div class="notice">Your videos will appear here.</div>'}`}catch{return originalRenderProfile()}}
window.renderProfile=renderProfileEnhanced;

const originalPublishPost=publishPost;
async function publishPostEnhanced(){const bar=$('uploadProgress'),status=$('uploadStatus');if(!user)return openModal('authModal');const f=$('mediaFile').files[0];if(!f)return toast('Select a video or image.');if(f.size>MAX)return toast('Maximum size is 200 MB.');let b=$('publishBtn');b.disabled=true;try{let ext=(f.name.split('.').pop()||'bin').toLowerCase(),path=`posts/${user.uid}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`,task=uploadBytesResumable(ref(storage,path),f,{contentType:f.type});let url=await new Promise((res,rej)=>task.on('state_changed',s=>{let pct=Math.round(s.bytesTransferred/s.totalBytes*100);b.textContent=`Uploading ${pct}%`;if(bar)bar.style.width=pct+'%';if(status)status.textContent=`Uploading ${pct}% — keep this page open`;},rej,async()=>res(await getDownloadURL(task.snapshot.ref))));let tags=$('hashtags').value.split(/[\s,]+/).map(x=>x.replace(/^#/,'').toLowerCase()).filter(Boolean).slice(0,30);await addDoc(collection(db,'posts'),{uid:user.uid,userName:profile?.name||'WorldVibe User',username:profile?.username||'',avatar:profile?.avatar||'',caption:$('caption').value.trim(),hashtags:tags,privacy:$('privacy').value,mediaUrl:url,mediaType:f.type.startsWith('video/')?'video':'image',storagePath:path,createdAt:serverTimestamp(),likesCount:0,commentsCount:0,viewsCount:0});$('mediaFile').value='';$('caption').value='';$('hashtags').value='';$('vprev').style.display='none';$('iprev').style.display='none';if(bar)bar.style.width='100%';if(status)status.textContent='Published successfully ✅';toast('Published successfully ✅');openPage('home')}catch(e){toast('Upload failed: '+e.message);if(status)status.textContent='Upload failed.'}finally{b.disabled=false;b.textContent='Publish';setTimeout(()=>{if(bar)bar.style.width='0%'},1200)}}
window.publishPost=publishPostEnhanced;

$('headerAccount').onclick=()=>user?openPage('profile'):openModal('authModal');

</script></body></html>
