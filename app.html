<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>WorldVibe 🌍🎬</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
a{color:inherit;text-decoration:none}

:root{
 --bg:#050505;
 --card:#111;
 --card2:#171717;
 --text:#fff;
 --muted:#9b9b9b;
 --line:#292929;
 --accent:#ff245c;
 --accent2:#7c4dff;
 --green:#20d889;
 --gold:#ffc83d;
}

body.light{
 --bg:#f5f5f5;
 --card:#fff;
 --card2:#eee;
 --text:#111;
 --muted:#666;
 --line:#ddd;
}

body{background:var(--bg);color:var(--text)}

#app{min-height:100vh}

.auth{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:
 radial-gradient(circle at 20% 10%,rgba(255,36,92,.25),transparent 30%),
 radial-gradient(circle at 90% 90%,rgba(124,77,255,.25),transparent 35%),
 var(--bg);
}

.authBox{
 width:100%;
 max-width:440px;
 background:rgba(17,17,17,.94);
 border:1px solid var(--line);
 border-radius:28px;
 padding:28px;
 box-shadow:0 25px 80px rgba(0,0,0,.5);
}

.logo{
 font-size:29px;
 font-weight:900;
 letter-spacing:-1px;
}

.logo span{color:var(--accent)}

.logoSub{
 color:var(--muted);
 margin-top:5px;
 font-size:13px;
}

.authTabs{
 display:flex;
 margin:25px 0 18px;
 background:var(--card2);
 border-radius:14px;
 padding:4px;
}

.authTabs button{
 flex:1;
 border:0;
 background:transparent;
 color:var(--muted);
 padding:11px 4px;
 border-radius:10px;
}

.authTabs button.active{
 background:var(--accent);
 color:#fff;
}

.field{margin:12px 0}

.field label{
 display:block;
 color:var(--muted);
 font-size:12px;
 margin-bottom:6px;
}

.field input,.field textarea,.field select{
 width:100%;
 border:1px solid var(--line);
 background:var(--card2);
 color:var(--text);
 border-radius:13px;
 padding:13px;
 outline:none;
}

.field input:focus,.field textarea:focus{
 border-color:var(--accent);
}

.primary{
 width:100%;
 border:0;
 background:linear-gradient(135deg,var(--accent),#ff4d85);
 color:#fff;
 padding:14px;
 border-radius:14px;
 font-weight:800;
 margin-top:10px;
}

.secondary{
 width:100%;
 border:1px solid var(--line);
 background:var(--card2);
 color:var(--text);
 padding:13px;
 border-radius:14px;
 font-weight:700;
 margin-top:10px;
}

.small{
 font-size:12px;
 color:var(--muted);
 line-height:1.5;
}

.notice{
 padding:16px;
 border:1px solid var(--line);
 background:var(--card);
 border-radius:16px;
 color:var(--muted);
}

.error{
 color:#ff5c7c;
 background:rgba(255,36,92,.1);
 border:1px solid rgba(255,36,92,.25);
 padding:11px;
 border-radius:12px;
 font-size:13px;
 margin:10px 0;
}

.success{
 color:var(--green);
 background:rgba(32,216,137,.1);
 border:1px solid rgba(32,216,137,.25);
 padding:11px;
 border-radius:12px;
 font-size:13px;
 margin:10px 0;
}

#mainApp{display:none;min-height:100vh}

.topbar{
 position:fixed;
 top:0;
 left:0;
 right:0;
 height:62px;
 z-index:100;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 16px;
 background:rgba(5,5,5,.9);
 backdrop-filter:blur(18px);
 border-bottom:1px solid var(--line);
}

body.light .topbar{background:rgba(255,255,255,.9)}

.topLogo{font-size:20px;font-weight:900}
.topLogo span{color:var(--accent)}

.topActions{display:flex;gap:8px}

.iconBtn{
 width:40px;
 height:40px;
 border-radius:50%;
 border:1px solid var(--line);
 background:var(--card2);
 color:var(--text);
}

.content{
 padding:78px 12px 90px;
 max-width:900px;
 margin:auto;
}

.pageTitle{
 font-size:25px;
 font-weight:900;
 margin:6px 0 18px;
}

.feedTabs{
 display:flex;
 gap:8px;
 overflow:auto;
 margin-bottom:12px;
 scrollbar-width:none;
}

.feedTabs button{
 flex:0 0 auto;
 border:1px solid var(--line);
 background:var(--card2);
 color:var(--muted);
 padding:9px 15px;
 border-radius:20px;
}

.feedTabs button.active{
 color:#fff;
 background:var(--accent);
 border-color:var(--accent);
}

.videoCard{
 position:relative;
 background:#000;
 border-radius:20px;
 overflow:hidden;
 margin-bottom:18px;
 min-height:560px;
 max-height:760px;
 border:1px solid var(--line);
}

.videoCard video,
.videoCard img{
 width:100%;
 height:100%;
 min-height:560px;
 max-height:760px;
 object-fit:cover;
 display:block;
 background:#000;
}

.videoOverlay{
 position:absolute;
 inset:0;
 display:flex;
 flex-direction:column;
 justify-content:flex-end;
 pointer-events:none;
 background:linear-gradient(transparent 50%,rgba(0,0,0,.8));
}

.videoInfo{
 padding:18px;
 padding-right:85px;
 pointer-events:auto;
}

.creator{
 font-weight:900;
 margin-bottom:7px;
}

.caption{
 font-size:14px;
 line-height:1.45;
}

.hashtags{
 color:#63a8ff;
 margin-top:8px;
 font-size:13px;
}

.sideActions{
 position:absolute;
 right:10px;
 bottom:28px;
 display:flex;
 flex-direction:column;
 gap:13px;
 z-index:5;
}

.sideAction{
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:3px;
}

.sideAction button{
 width:47px;
 height:47px;
 border-radius:50%;
 border:1px solid rgba(255,255,255,.2);
 background:rgba(0,0,0,.55);
 color:#fff;
 font-size:19px;
}

.sideAction button.active{color:var(--accent)}
.sideAction small{font-size:10px}

.empty{
 padding:45px 15px;
 text-align:center;
 color:var(--muted);
}

.bottomNav{
 position:fixed;
 left:0;
 right:0;
 bottom:0;
 height:70px;
 z-index:100;
 display:flex;
 justify-content:space-around;
 align-items:center;
 background:rgba(5,5,5,.95);
 backdrop-filter:blur(18px);
 border-top:1px solid var(--line);
}

body.light .bottomNav{background:rgba(255,255,255,.95)}

.navItem{
 border:0;
 background:transparent;
 color:var(--muted);
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:4px;
 font-size:10px;
 min-width:55px;
}

.navItem b{font-size:20px}
.navItem.active{color:var(--text)}
.navItem.create b{
 width:43px;
 height:35px;
 display:flex;
 align-items:center;
 justify-content:center;
 background:linear-gradient(135deg,var(--accent),var(--accent2));
 color:#fff;
 border-radius:12px;
 font-size:24px;
}

.section{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:20px;
 padding:18px;
 margin-bottom:15px;
}

.profileHead{
 text-align:center;
 padding:15px 0 25px;
}

.avatar{
 width:92px;
 height:92px;
 border-radius:50%;
 object-fit:cover;
 background:var(--card2);
 border:3px solid var(--accent);
}

.profileName{
 font-size:23px;
 font-weight:900;
 margin-top:10px;
}

.profileBio{
 color:var(--muted);
 margin:6px auto;
 max-width:500px;
}

.stats{
 display:flex;
 justify-content:center;
 gap:35px;
 margin:20px 0;
}

.stat{text-align:center}
.stat b{display:block;font-size:20px}
.stat span{color:var(--muted);font-size:12px}

.btnRow{
 display:flex;
 gap:9px;
 flex-wrap:wrap;
 justify-content:center;
}

.btn{
 border:1px solid var(--line);
 background:var(--card2);
 color:var(--text);
 border-radius:12px;
 padding:10px 15px;
 font-weight:700;
}

.btn.primaryBtn{
 background:var(--accent);
 border-color:var(--accent);
}

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:4px;
}

.gridItem{
 aspect-ratio:9/14;
 background:#111;
 border-radius:5px;
 overflow:hidden;
 position:relative;
}

.gridItem video,.gridItem img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.searchBox{
 display:flex;
 gap:8px;
 margin-bottom:15px;
}

.searchBox input{
 flex:1;
 border:1px solid var(--line);
 background:var(--card);
 color:var(--text);
 padding:12px;
 border-radius:13px;
}

.searchBox button{
 width:48px;
 border:0;
 border-radius:13px;
 background:var(--accent);
 color:#fff;
}

.uploadArea{
 border:2px dashed var(--line);
 border-radius:20px;
 padding:30px 15px;
 text-align:center;
}

.uploadArea input{display:none}

.uploadLabel{
 display:inline-block;
 padding:14px 22px;
 background:var(--accent);
 border-radius:14px;
 font-weight:800;
 cursor:pointer;
}

.preview{
 margin-top:18px;
 max-height:400px;
 width:100%;
 object-fit:contain;
 border-radius:16px;
 background:#000;
}

.progress{
 height:9px;
 background:var(--card2);
 border-radius:10px;
 overflow:hidden;
 margin-top:15px;
}

.progressBar{
 width:0%;
 height:100%;
 background:linear-gradient(90deg,var(--accent),var(--accent2));
 transition:width .2s;
}

.listItem{
 display:flex;
 gap:12px;
 align-items:center;
 padding:13px 0;
 border-bottom:1px solid var(--line);
}

.listItem:last-child{border-bottom:0}

.miniAvatar{
 width:46px;
 height:46px;
 border-radius:50%;
 object-fit:cover;
 background:var(--card2);
}

.listBody{flex:1}
.listBody b{display:block}
.listBody span{font-size:12px;color:var(--muted)}

.dashboardGrid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}

.metric{
 padding:18px;
 border-radius:17px;
 background:var(--card2);
 border:1px solid var(--line);
}

.metric b{
 display:block;
 font-size:25px;
 margin-bottom:5px;
}

.metric span{font-size:12px;color:var(--muted)}

.futureCard{
 padding:17px;
 border:1px solid var(--line);
 background:linear-gradient(135deg,var(--card),var(--card2));
 border-radius:17px;
 margin-bottom:10px;
}

.futureCard strong{display:block;margin-bottom:5px}
.futureCard span{color:var(--muted);font-size:12px}

.modal{
 position:fixed;
 inset:0;
 z-index:500;
 background:rgba(0,0,0,.75);
 display:none;
 align-items:flex-end;
 justify-content:center;
}

.modal.show{display:flex}

.modalBox{
 width:100%;
 max-width:600px;
 max-height:90vh;
 overflow:auto;
 background:var(--card);
 border-radius:25px 25px 0 0;
 padding:20px;
 border:1px solid var(--line);
}

.modalHead{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:15px;
}

.toast{
 position:fixed;
 left:50%;
 bottom:85px;
 transform:translateX(-50%);
 z-index:1000;
 background:#222;
 color:#fff;
 padding:12px 18px;
 border-radius:13px;
 font-size:13px;
 display:none;
 box-shadow:0 10px 40px rgba(0,0,0,.4);
}

.toast.show{display:block}

@media(max-width:600px){
 .content{padding-left:8px;padding-right:8px}
 .videoCard,.videoCard video,.videoCard img{
  min-height:calc(100vh - 135px);
  max-height:calc(100vh - 135px);
 }
 .dashboardGrid{grid-template-columns:1fr 1fr}
}

@media(min-width:700px){
 .bottomNav{max-width:700px;left:50%;transform:translateX(-50%);border-radius:20px 20px 0 0}
}
</style>
</head>

<body>

<div id="toast" class="toast"></div>

<!-- AUTH -->
<section id="authScreen" class="auth">
 <div class="authBox">

  <div class="logo">World<span>Vibe</span> 🌍🎬</div>
  <div class="logoSub">Share your world. Discover every vibe.</div>

  <div id="authMessage"></div>

  <div class="authTabs">
   <button class="active" data-auth-tab="login">Login</button>
   <button data-auth-tab="signup">Sign Up</button>
   <button data-auth-tab="reset">Reset</button>
  </div>

  <div id="loginForm">
   <div class="field">
    <label>Email</label>
    <input id="loginEmail" type="email" autocomplete="email" placeholder="your@email.com">
   </div>

   <div class="field">
    <label>Password</label>
    <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password">
   </div>

   <button id="loginBtn" class="primary">Login</button>

   <p class="small" style="margin-top:15px">
    WorldVibe uses Firebase Authentication to protect your account.
   </p>
  </div>

  <div id="signupForm" class="hidden">
   <div class="field">
    <label>Full Name</label>
    <input id="signupName" type="text" placeholder="Your name">
   </div>

   <div class="field">
    <label>Email</label>
    <input id="signupEmail" type="email" autocomplete="email" placeholder="your@email.com">
   </div>

   <div class="field">
    <label>Password</label>
    <input id="signupPassword" type="password" autocomplete="new-password" placeholder="Minimum 6 characters">
   </div>

   <button id="signupBtn" class="primary">Create Account</button>
  </div>

  <div id="resetForm" class="hidden">
   <div class="field">
    <label>Email</label>
    <input id="resetEmail" type="email" placeholder="your@email.com">
   </div>

   <button id="resetBtn" class="primary">Send Reset Email</button>
  </div>

 </div>
</section>

<!-- MAIN -->
<div id="mainApp">

 <header class="topbar">
  <div class="topLogo">World<span>Vibe</span> 🌍</div>

  <div class="topActions">
   <button id="themeBtn" class="iconBtn" title="Theme">☀️</button>
   <button id="logoutBtn" class="iconBtn" title="Logout">↪</button>
  </div>
 </header>

 <main id="content" class="content"></main>

 <nav class="bottomNav">

  <button class="navItem active" data-page="home">
   <b>⌂</b><span>Home</span>
  </button>

  <button class="navItem" data-page="discover">
   <b>⌕</b><span>Discover</span>
  </button>

  <button class="navItem create" data-page="create">
   <b>＋</b><span>Create</span>
  </button>

  <button class="navItem" data-page="notifications">
   <b>♡</b><span>Alerts</span>
  </button>

  <button class="navItem" data-page="profile">
   <b>◉</b><span>Profile</span>
  </button>

 </nav>
</div>

<!-- MODAL -->
<div id="modal" class="modal">
 <div class="modalBox">
  <div class="modalHead">
   <strong id="modalTitle">WorldVibe</strong>
   <button id="modalClose" class="iconBtn">×</button>
  </div>
  <div id="modalContent"></div>
 </div>
</div>

<script type="module">

/* =========================================================
   WORLDVIBE
   FIREBASE CONFIG — OFFICIAL PROJECT CONFIG
========================================================= */

import { initializeApp }
 from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getAuth,
 onAuthStateChanged,
 signInWithEmailAndPassword,
 createUserWithEmailAndPassword,
 sendPasswordResetEmail,
 signOut,
 updateProfile,
 deleteUser
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
 getFirestore,
 doc,
 getDoc,
 setDoc,
 updateDoc,
 addDoc,
 collection,
 query,
 orderBy,
 limit,
 getDocs,
 where,
 serverTimestamp,
 arrayUnion,
 arrayRemove,
 increment,
 deleteDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
 getStorage,
 ref,
 uploadBytesResumable,
 getDownloadURL,
 deleteObject
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";


const firebaseConfig = {
 apiKey: "AIzaSyArCb63lg3xTgM1mQPYQzeLNN7awL8Gx3A",
 authDomain: "worldvibe-9f531.firebaseapp.com",
 projectId: "worldvibe-9f531",
 storageBucket: "worldvibe-9f531.firebasestorage.app",
 messagingSenderId: "148680723994",
 appId: "1:148680723994:web:c9cf32cd47d7a3ec190ba3",
 measurementId: "G-WZ9G2B2EDP"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);


/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let currentPage = "home";
let currentFeed = "latest";

let posts = [];
let myProfile = null;
let selectedUpload = null;
let uploadType = "video";

let localDrafts = JSON.parse(localStorage.getItem("worldvibe_drafts") || "[]");

const $ = id => document.getElementById(id);


/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value=""){
 return String(value)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

function showToast(message){
 const el = $("toast");
 el.textContent = message;
 el.classList.add("show");

 clearTimeout(window.__toastTimer);

 window.__toastTimer = setTimeout(()=>{
  el.classList.remove("show");
 },2600);
}

function authMessage(message,type="error"){
 $("authMessage").innerHTML =
  `<div class="${type}">${escapeHTML(message)}</div>`;
}

function clearAuthMessage(){
 $("authMessage").innerHTML="";
}

function formatNumber(number){
 number = Number(number || 0);

 if(number >= 1000000)
  return (number/1000000).toFixed(1)+"M";

 if(number >= 1000)
  return (number/1000).toFixed(1)+"K";

 return String(number);
}

function formatDate(timestamp){
 try{
  if(!timestamp) return "";
  const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
  return date.toLocaleDateString();
 }catch{
  return "";
 }
}

function makeId(){
 return crypto.randomUUID
  ? crypto.randomUUID()
  : Date.now()+"_"+Math.random().toString(36).slice(2);
}

function hashtags(text=""){
 return [...new Set(
  (text.match(/#[a-zA-Z0-9_]+/g) || [])
 )].join(" ");
}


/* =========================================================
   AUTH TABS
========================================================= */

document.querySelectorAll("[data-auth-tab]").forEach(button=>{

 button.addEventListener("click",()=>{

  document.querySelectorAll("[data-auth-tab]")
   .forEach(b=>b.classList.remove("active"));

  button.classList.add("active");

  $("loginForm").classList.add("hidden");
  $("signupForm").classList.add("hidden");
  $("resetForm").classList.add("hidden");

  const tab = button.dataset.authTab;

  if(tab==="login")
   $("loginForm").classList.remove("hidden");

  if(tab==="signup")
   $("signupForm").classList.remove("hidden");

  if(tab==="reset")
   $("resetForm").classList.remove("hidden");

  clearAuthMessage();
 });
});


/* =========================================================
   SIGN UP
========================================================= */

$("signupBtn").addEventListener("click",async()=>{

 clearAuthMessage();

 const name = $("signupName").value.trim();
 const email = $("signupEmail").value.trim();
 const password = $("signupPassword").value;

 if(!name || !email || !password){
  authMessage("Please complete all fields.");
  return;
 }

 if(password.length < 6){
  authMessage("Password must be at least 6 characters.");
  return;
 }

 try{

  $("signupBtn").disabled = true;
  $("signupBtn").textContent = "Creating...";

  const result =
   await createUserWithEmailAndPassword(
    auth,
    email,
    password
   );

  await updateProfile(result.user,{
   displayName:name
  });

  await createUserProfile(result.user,name);

  authMessage("Account created successfully.","success");

 }catch(error){

  console.error(error);
  authMessage(firebaseError(error));

 }finally{

  $("signupBtn").disabled = false;
  $("signupBtn").textContent = "Create Account";
 }
});


/* =========================================================
   LOGIN
========================================================= */

$("loginBtn").addEventListener("click",async()=>{

 clearAuthMessage();

 const email = $("loginEmail").value.trim();
 const password = $("loginPassword").value;

 if(!email || !password){
  authMessage("Enter email and password.");
  return;
 }

 try{

  $("loginBtn").disabled = true;
  $("loginBtn").textContent = "Logging in...";

  await signInWithEmailAndPassword(
   auth,
   email,
   password
  );

 }catch(error){

  console.error(error);
  authMessage(firebaseError(error));

 }finally{

  $("loginBtn").disabled = false;
  $("loginBtn").textContent = "Login";
 }
});


/* =========================================================
   RESET PASSWORD
========================================================= */

$("resetBtn").addEventListener("click",async()=>{

 clearAuthMessage();

 const email = $("resetEmail").value.trim();

 if(!email){
  authMessage("Enter your email address.");
  return;
 }

 try{

  await sendPasswordResetEmail(auth,email);

  authMessage(
   "Password reset email sent. Check your inbox.",
   "success"
  );

 }catch(error){

  console.error(error);
  authMessage(firebaseError(error));
 }
});


function firebaseError(error){

 const code = error?.code || "";

 const messages = {
  "auth/invalid-email":"Invalid email address.",
  "auth/user-not-found":"No account found with this email.",
  "auth/wrong-password":"Incorrect password.",
  "auth/invalid-credential":"Email or password is incorrect.",
  "auth/email-already-in-use":"This email is already registered.",
  "auth/weak-password":"Password is too weak.",
  "auth/too-many-requests":"Too many attempts. Please try again later.",
  "auth/network-request-failed":"Network error. Check your internet connection.",
  "auth/api-key-not-valid.-please-pass-a-valid-api-key.":"Firebase API key is not valid."
 };

 return messages[code] || error?.message || "Something went wrong.";
}

async function loadFeed(){

  const q = query(
   collection(db,"posts"),
   orderBy("createdAt","desc"),
   limit(50)
  );

   id:docSnap.id,

/* =========================================================
   VIDEO AUTOPLAY
========================================================= */

function activateVideoObservers(){

 const videos =
  document.querySelectorAll(".videoCard video");

 if(!videos.length) return;

 const observer =
  new IntersectionObserver(entries=>{

   entries.forEach(entry=>{

    const video = entry.target;

    if(entry.isIntersecting){

     video.play().catch(()=>{});

    }else{

     video.pause();
    }

   });

  },{
   threshold:.65
  });

 videos.forEach(video=>observer.observe(video));
}

async function toggleLike(postId){

 if(!currentUser) return;

 try{

  const postRef = doc(db,"posts",postId);

  const snap = await getDoc(postRef);

  if(!snap.exists()) return;

  const data = snap.data();

  const likes = data.likes || [];

  if(likes.includes(currentUser.uid)){

   await updateDoc(postRef,{
    likes:arrayRemove(currentUser.uid),
    likesCount:increment(-1)
   });

  }else{

   await updateDoc(postRef,{
    likes:arrayUnion(currentUser.uid),
    likesCount:increment(1)
   });
  }

  await loadFeed();

 }catch(error){

  console.error(error);
  showToast("Unable to update like.");
 }
}

async function toggleFollow(uid){

 if(uid===currentUser.uid) return;

 const myRef =
  doc(db,"users",currentUser.uid);

 const otherRef =
  doc(db,"users",uid);

 try{

  const [mySnap,otherSnap] =
   await Promise.all([
    getDoc(myRef),
    getDoc(otherRef)
   ]);

  if(!otherSnap.exists()) return;

  const following =
   mySnap.data().following || [];

  if(following.includes(uid)){

   await updateDoc(myRef,{
    following:arrayRemove(uid),
    followingCount:increment(-1)
   });

   await updateDoc(otherRef,{
    followers:arrayRemove(currentUser.uid),
    followersCount:increment(-1)
   });

   showToast("Unfollowed.");

  }else{

   await updateDoc(myRef,{
    following:arrayUnion(uid),
    followingCount:increment(1)
   });

   await updateDoc(otherRef,{
    followers:arrayUnion(currentUser.uid),
    followersCount:increment(1)
   });

   showToast("Following.");
  }

  await loadMyProfile();
  await loadFeed();

 }catch(error){

  console.error(error);
  showToast("Unable to follow user.");
 }
}

async function publishPost(){

  showToast("Choose a video or photo.");
  return;
 }

 const caption =
  $("postCaption").value.trim();

 const tagInput =
  $("postHashtags").value.trim();

 const tags =
  hashtags(`${caption} ${tagInput}`);

 const button =
  $("publishPost");

 try{

  button.disabled=true;
  button.textContent="Uploading...";

  $("uploadProgress").classList.remove("hidden");

  const fileName =
   `${Date.now()}_${selectedUpload.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`;

  const storageRef =
   ref(
    storage,
    `posts/${currentUser.uid}/${fileName}`
   );

  const uploadTask =
   uploadBytesResumable(
    storageRef,
    selectedUpload
   );

  const mediaURL =
   await new Promise((resolve,reject)=>{

    uploadTask.on(
     "state_changed",

     snapshot=>{

      const percent =
       snapshot.totalBytes
        ? (snapshot.bytesTransferred / snapshot.totalBytes)*100
        : 0;

      $("uploadProgressBar").style.width =
       percent+"%";

     },

     reject,

     async()=>{

      try{

       resolve(
        await getDownloadURL(
         uploadTask.snapshot.ref
        )
       );

      }catch(error){

       reject(error);
      }
     }
    );
   });

  const postData={

   uid:currentUser.uid,

   username:
    myProfile?.username ||
    createUsername(currentUser.email),

   displayName:
    myProfile?.name ||
    currentUser.displayName ||
    "WorldVibe User",

   photoURL:
    myProfile?.photoURL || "",

   mediaURL,

   mediaType:uploadType,

   caption,

   hashtags:tags,

   likes:[],
   saves:[],

   likesCount:0,
   commentsCount:0,
   viewsCount:0,
   sharesCount:0,

   createdAt:serverTimestamp(),

   visibility:"public",

   status:"published"
  };

  await addDoc(
   collection(db,"posts"),
   postData
  );

  await updateDoc(
   doc(db,"users",currentUser.uid),
   {
    postsCount:increment(1)
   }
  );

  showToast("Published successfully! 🌍🎬");

  selectedUpload=null;

  $("postCaption").value="";
  $("postHashtags").value="";
  $("mediaInput").value="";
  $("uploadPreview").innerHTML="";
  $("uploadDetails").classList.add("hidden");
  $("uploadProgress").classList.add("hidden");

  await loadMyProfile();

  setTimeout(
   ()=>openPage("home"),
   700
  );

 }catch(error){

  console.error(error);

  showToast(
   error?.message ||
   "Upload failed."
  );

 }finally{

  button.disabled=false;
  button.textContent="Publish";
 }
}

async function loadProfilePosts(){

 const grid=$("profileGrid");

 if(!grid) return;

 try{

  const snap =
   await getDocs(
    query(
     collection(db,"posts"),
     where("uid","==",currentUser.uid),
     limit(60)
    )
   );

  const list =
   snap.docs.map(d=>({
    id:d.id,
    ...d.data()
   }));

  if(!list.length){

   grid.innerHTML=`
    <div class="empty"
     style="grid-column:1/-1">
     Your videos will appear here.
    </div>
   `;

   return;
  }

  grid.innerHTML =
   list.map(post=>{

    const media =
     post.mediaType==="image"
      ? `<img src="${escapeHTML(post.mediaURL)}">`
      : `<video src="${escapeHTML(post.mediaURL)}" muted></video>`;

    return `
     <div class="gridItem">
      ${media}
     </div>
    `;

   }).join("");

 }catch(error){

  console.error(error);

  grid.innerHTML =
   `<div class="small">Unable to load posts.</div>`;
 }
}

async function saveProfile(){

 const name =
  $("editName").value.trim();

 const username =
  $("editUsername").value.trim();

 const bio =
  $("editBio").value.trim();

 if(!name){

  showToast("Name is required.");
  return;
 }

 try{

  await updateDoc(
   doc(db,"users",currentUser.uid),
   {
    name,
    username:username.startsWith("@")
     ? username
     : "@"+username,
    bio
   }
  );

  await updateProfile(
   currentUser,
   {
    displayName:name
   }
  );

  await loadMyProfile();

  closeModal();

  await renderProfile();

  showToast("Profile updated.");

 }catch(error){

  console.error(error);
  showToast("Unable to update profile.");
 }
}

   THEME
========================================================= */

function loadTheme(){

 const theme =
  localStorage.getItem("worldvibe_theme");

 if(theme==="light")
  document.body.classList.add("light");
}

function toggleTheme(){

 document.body.classList.toggle("light");

 localStorage.setItem(
  "worldvibe_theme",
  document.body.classList.contains("light")
   ? "light"
   : "dark"
 );
}

$("themeBtn").addEventListener(
 "click",
 toggleTheme
);

loadTheme();

async function handleDeepLink(){

 const params =
  new URLSearchParams(location.search);

 const postId =
  params.get("post");

 if(!postId) return;

 try{

  const snap =
   await getDoc(
    doc(db,"posts",postId)
   );

  if(!snap.exists()) return;

  const post={
   id:snap.id,
   ...snap.data()
  };

  $("content").innerHTML=`
   <div class="pageTitle">WorldVibe 🎬</div>
   ${postCard(post)}
  `;

  activateVideoObservers();

  document.querySelectorAll("[data-like]").forEach(button=>{
   button.addEventListener("click",()=>toggleLike(button.dataset.like));
  });

  document.querySelectorAll("[data-save]").forEach(button=>{
   button.addEventListener("click",()=>toggleSave(button.dataset.save));
  });

  document.querySelectorAll("[data-share]").forEach(button=>{
   button.addEventListener("click",()=>sharePost(button.dataset.share));
  });

  document.querySelectorAll("[data-comment]").forEach(button=>{
   button.addEventListener("click",()=>openComments(button.dataset.comment));
  });

 }catch(error){

  console.error(error);
 }
}


/* =========================================================
   PWA SERVICE WORKER FOUNDATION
========================================================= */

if(
 "serviceWorker" in navigator &&
 location.protocol==="https:"
){

 const swCode = `

 self.addEventListener("install",event=>{
  self.skipWaiting();
 });

 self.addEventListener("activate",event=>{
  event.waitUntil(self.clients.claim());
 });

 self.addEventListener("fetch",event=>{
  event.respondWith(
   fetch(event.request).catch(
    ()=>caches.match(event.request)
   )
  );
 });

 `;

 try{

  const blob =
   new Blob([swCode],{
    type:"text/javascript"
   });

  const swURL =
   URL.createObjectURL(blob);

  navigator.serviceWorker.register(swURL)
   .catch(()=>{});

 }catch{}
}
