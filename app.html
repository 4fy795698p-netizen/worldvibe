<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>WorldVibe 🌍🎬</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  background:#050505;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif
}
body{
  max-width:720px;
  margin:auto;
  min-height:100vh;
  background:#0b0b0f
}
button,input,textarea{font:inherit}
button{
  border:0;
  border-radius:12px;
  padding:11px 14px;
  background:#262633;
  color:#fff;
  cursor:pointer
}
button.primary{
  background:#fff;
  color:#000;
  font-weight:700
}
button.danger{background:#451919}

header{
  position:sticky;
  top:0;
  z-index:5;
  padding:14px 16px;
  background:#0b0b0fee;
  backdrop-filter:blur(12px);
  display:flex;
  justify-content:space-between;
  align-items:center
}
.logo{
  font-weight:800;
  font-size:20px
}
.page{
  display:none;
  padding:14px 14px 90px
}
.page.active{display:block}

nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(720px,100%);
  z-index:10;
  display:flex;
  justify-content:space-around;
  padding:9px;
  background:#111118ee;
  backdrop-filter:blur(14px);
  border-top:1px solid #292934
}
nav button{
  background:transparent;
  padding:8px;
  font-size:12px
}

.card{
  background:#15151d;
  border:1px solid #292934;
  border-radius:16px;
  margin:12px 0;
  overflow:hidden
}
.pad{padding:13px}
.media{
  width:100%;
  max-height:620px;
  background:#000;
  display:block;
  object-fit:cover
}
.muted{color:#9b9ba8}
.row{
  display:flex;
  gap:8px;
  align-items:center
}
.between{justify-content:space-between}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#333;
  object-fit:cover
}

.stats{
  display:flex;
  justify-content:space-around;
  text-align:center;
  margin:18px 0
}
.stat b{
  display:block;
  font-size:18px
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:3px
}
.grid img,.grid video{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  background:#111
}

input,textarea{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #333;
  background:#12121a;
  color:#fff;
  margin:6px 0 12px
}

input[type="checkbox"]{
  width:auto
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

.notice{
  padding:12px;
  border-radius:12px;
  background:#1c1c27;
  margin:8px 0
}

.modal{
  position:fixed;
  inset:0;
  background:#000b;
  z-index:20;
  display:none;
  align-items:flex-end
}
.modal.show{display:flex}

.sheet{
  background:#15151d;
  width:100%;
  max-width:720px;
  margin:auto 0 0;
  padding:18px;
  border-radius:20px 20px 0 0;
  max-height:90vh;
  overflow:auto
}

hr{
  border:0;
  border-top:1px solid #292934;
  margin:15px 0
}
</style>
</head>

<body>

<header>
  <div class="logo">WorldVibe 🌍🎬</div>

  <div class="row">
    <button onclick="openSearch()">🔎</button>
    <button id="authBtn" onclick="openAuth()">Login</button>
  </div>
</header>

<!-- HOME -->
<section id="home" class="page active">
  <h2>For You</h2>
  <div id="feed"></div>
</section>

<!-- EXPLORE -->
<section id="explore" class="page">
  <h2>Explore</h2>

  <input
    id="searchInput"
    placeholder="Search creators, captions, tags..."
    oninput="renderExplore()"
  >

  <div id="exploreGrid" class="grid"></div>
</section>

<!-- CREATE -->
<section id="create" class="page">
  <h2>Create</h2>

  <input
    id="mediaFile"
    type="file"
    accept="video/*,image/*"
    onchange="previewMedia()"
  >

  <div id="preview"></div>

  <textarea
    id="caption"
    rows="4"
    placeholder="Write a caption..."
  ></textarea>

  <input
    id="tags"
    placeholder="#travel #music #worldvibe"
  >

  <label>
    <input
      id="allowComments"
      type="checkbox"
      checked
    >
    Allow comments
  </label>

  <div class="actions">
    <button class="primary" onclick="publishPost()">
      Publish
    </button>

    <button onclick="saveDraft()">
      Save Draft
    </button>

    <button onclick="loadDraft()">
      Load Draft
    </button>
  </div>

  <p id="uploadStatus" class="muted"></p>
</section>

<!-- ACTIVITY -->
<section id="activity" class="page">
  <h2>Activity</h2>
  <div id="activityList"></div>
</section>

<!-- PROFILE -->
<section id="profile" class="page">

  <div class="row">
    <img
      id="avatar"
      class="avatar"
      alt="Avatar"
    >

    <div>
      <h2 id="profileName">WorldVibe User</h2>
      <div id="profileHandle" class="muted">
        @worldvibeuser
      </div>
    </div>
  </div>

  <p id="profileBio">
    Create • Connect • Discover
  </p>

  <div class="stats">

    <div class="stat">
      <b id="followers">0</b>
      Followers
    </div>

    <div class="stat">
      <b id="following">0</b>
      Following
    </div>

    <div class="stat">
      <b id="likes">0</b>
      Likes
    </div>

    <div class="stat">
      <b id="views">0</b>
      Views
    </div>

  </div>

  <div class="actions">

    <button onclick="editProfile()">
      Edit Profile
    </button>

    <button onclick="buyCoins()">
      Buy Coins
    </button>

    <button onclick="showGifts()">
      Gifts
    </button>

    <button onclick="withdraw()">
      Withdraw
    </button>

  </div>

  <div class="card pad">

    <b>Creator Center</b>

    <p>
      Coins:
      <span id="coins">0</span>
    </p>

    <p>
      Earnings:
      <span id="earnings">$0.00</span>
    </p>

  </div>

  <h3>Your videos</h3>

  <div id="profileGrid" class="grid"></div>

</section>

<!-- BOTTOM NAV -->
<nav>

  <button onclick="page('home')">
    🏠<br>Home
  </button>

  <button onclick="page('explore')">
    🔎<br>Explore
  </button>

  <button onclick="page('create')">
    ➕<br>Create
  </button>

  <button onclick="page('activity')">
    🔔<br>Activity
  </button>

  <button onclick="page('profile')">
    👤<br>Profile
  </button>

</nav>

<!-- AUTH MODAL -->
<div id="authModal" class="modal">

  <div class="sheet">

    <h2>WorldVibe Login</h2>

    <input
      id="email"
      type="email"
      placeholder="Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <div class="actions">

      <button
        class="primary"
        onclick="login()"
      >
        Login
      </button>

      <button onclick="signup()">
        Create account
      </button>

      <button onclick="closeModals()">
        Close
      </button>

    </div>

    <p
      id="authStatus"
      class="muted"
    ></p>

  </div>

</div>

<!-- PROFILE MODAL -->
<div id="profileModal" class="modal">

  <div class="sheet">

    <h2>Edit Profile</h2>

    <input
      id="editName"
      placeholder="Name"
    >

    <input
      id="editHandle"
      placeholder="@handle"
    >

    <textarea
      id="editBio"
      placeholder="Bio"
    ></textarea>

    <input
      id="avatarFile"
      type="file"
      accept="image/*"
    >

    <div class="actions">

      <button
        class="primary"
        onclick="saveProfile()"
      >
        Save
      </button>

      <button onclick="closeModals()">
        Cancel
      </button>

    </div>

  </div>

</div>

<!-- COMMENTS MODAL -->
<div id="commentsModal" class="modal">

  <div class="sheet">

    <h2>Comments</h2>

    <div id="comments"></div>

    <input
      id="commentText"
      placeholder="Write a comment..."
    >

    <div class="actions">

      <button
        class="primary"
        onclick="addComment()"
      >
        Post comment
      </button>

      <button onclick="closeModals()">
        Close
      </button>

    </div>

  </div>

</div>

<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  signOut
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  addDoc,
  collection,
  query,
  orderBy,
  limit,
  onSnapshot,
  updateDoc,
  arrayUnion,
  arrayRemove,
  serverTimestamp,
  increment,
  getDocs,
  deleteDoc
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-storage.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyArCb63lgx3tGMm1QPYQzeLNN7awL8Gx3A",

  authDomain:
  "worldvibe-9f531.firebaseapp.com",

  projectId:
  "worldvibe-9f531",

  storageBucket:
  "worldvibe-9f531.firebasestorage.app",

  messagingSenderId:
  "148680723994",

  appId:
  "1:148680723994:web:c9cf32cd47d7a3ec190ba3",

  measurementId:
  "G-WZ9G2B2EDP"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const storage = getStorage(app);


/* =========================
   GLOBAL STATE
========================= */

let user = null;

let posts = [];

let activePost = null;

let unsubscribePosts = null;


/* =========================
   HELPERS
========================= */

const $ = id =>
  document.getElementById(id);


function esc(value){

  return String(value || "")
    .replace(
      /[&<>"']/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[c])
    );

}


/* =========================
   PAGE NAVIGATION
========================= */

window.page = function(pageName){

  document
    .querySelectorAll(".page")
    .forEach(
      x => x.classList.remove("active")
    );

  $(pageName)
    .classList.add("active");

  renderAll();

};


/* =========================
   AUTH
========================= */

window.openAuth = function(){

  if(user){

    signOut(auth);

  }else{

    $("authModal")
      .classList.add("show");

  }

};


window.closeModals = function(){

  document
    .querySelectorAll(".modal")
    .forEach(
      x => x.classList.remove("show")
    );

};


window.login = async function(){

  try{

    await signInWithEmailAndPassword(
      auth,
      $("email").value,
      $("password").value
    );

    $("authStatus")
      .textContent =
      "Login successful ✅";

    setTimeout(
      closeModals,
      500
    );

  }catch(error){

    $("authStatus")
      .textContent =
      error.message;

  }

};


window.signup = async function(){

  try{

    await createUserWithEmailAndPassword(
      auth,
      $("email").value,
      $("password").value
    );

    $("authStatus")
      .textContent =
      "Account created ✅";

    setTimeout(
      closeModals,
      500
    );

  }catch(error){

    $("authStatus")
      .textContent =
      error.message;

  }

};


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  async currentUser => {

    user = currentUser;

    $("authBtn").textContent =
      user ? "Logout" : "Login";

    if(user){

      await ensureUser();

    }

    renderAll();

  }
);


/* =========================
   CREATE USER DOCUMENT
========================= */

async function ensureUser(){

  const userRef =
    doc(
      db,
      "users",
      user.uid
    );

  const snapshot =
    await getDoc(userRef);

  if(!snapshot.exists()){

    const username =
      user.email
        ?.split("@")[0]
        ?.replace(/[^a-zA-Z0-9_]/g,"")
      || "worldvibeuser";

    await setDoc(
      userRef,
      {

        name:
          username,

        handle:
          "@" + username,

        bio:
          "Create • Connect • Discover",

        avatar:
          "",

        followers:
          [],

        following:
          [],

        likes:
          0,

        views:
          0,

        coins:
          0,

        earnings:
          0,

        created:
          serverTimestamp()

      }
    );

  }

}


/* =========================
   LOAD POSTS
========================= */

function loadPosts(){

  if(unsubscribePosts){

    unsubscribePosts();

  }

  const postsQuery =
    query(
      collection(db,"posts"),
      orderBy("createdAt","desc"),
      limit(50)
    );

  unsubscribePosts =
  onSnapshot(
    postsQuery,
    snapshot => {

      posts =
        snapshot.docs.map(
          item => ({
            id:item.id,
            ...item.data()
          })
        );

      renderAll();

    },
    error => {

      console.error("Posts listener error:", error);

      const feed = $("feed");

      if (feed) {
        feed.innerHTML =
          `<div class="notice">
            Feed error: ${esc(error.message || error)}
          </div>`;
      }

    }
  );
}


loadPosts();


/* =========================
   RENDER ALL
========================= */

function renderAll(){

  renderFeed();

  renderExplore();

  renderActivity();

  renderProfile();

}


/* =========================
   POST CARD
========================= */

function postCard(post){

  const liked =
    (post.likedBy || [])
      .includes(user?.uid);

  const own =
    user &&
    post.uid === user.uid;

  const media =
    post.type === "image"

      ?

      `<img
        class="media"
        src="${esc(post.mediaUrl)}"
        alt="WorldVibe post"
      >`

      :

      `<video
        class="media"
        controls
        playsinline
        src="${esc(post.mediaUrl)}"
        onplay="countView('${post.id}')"
      ></video>`;


  return `

  <article class="card">

    <div class="pad row between">

      <div>

        <b>
          ${esc(
            post.authorName ||
            "WorldVibe User"
          )}
        </b>

        <div class="muted">
          ${esc(
            post.authorHandle ||
            "@worldvibeuser"
          )}
        </div>

      </div>

      ${
        user && !own

        ?

        `<button
          onclick="toggleFollow('${post.uid}')"
        >
          Follow
        </button>`

        :

        ""
      }

    </div>

    ${media}

    <div class="pad">

      <b>
        ${esc(post.caption)}
      </b>

      <p class="muted">

        ${
          (post.tags || [])
            .map(
              tag =>
              "#" + esc(tag)
            )
            .join(" ")
        }

      </p>

      <div class="actions">

        <button
          onclick="toggleLike('${post.id}')"
        >
          ${liked ? "❤️" : "🤍"}
          ${post.likes || 0}
        </button>

        <button
          onclick="openComments('${post.id}')"
        >
          💬 ${post.commentsCount || 0}
        </button>

        <button
          onclick="sharePost('${post.id}')"
        >
          ↗️ Share
        </button>

        <button
          onclick="savePost('${post.id}')"
        >
          🔖 Save
        </button>

        ${
          own

          ?

          `<button
            class="danger"
            onclick="deletePost('${post.id}')"
          >
            Delete
          </button>`

          :

          ""
        }

      </div>

    </div>

  </article>

  `;

}


/* =========================
   HOME FEED
========================= */

function renderFeed(){

  if(!$("feed")) return;

  $("feed").innerHTML =
    posts.length

    ?

    posts
      .map(postCard)
      .join("")

    :

    `
    <div class="notice">
      No videos yet.
      Create the first WorldVibe post 🎬
    </div>
    `;

}


/* =========================
   EXPLORE
========================= */

window.renderExplore = function(){

  if(!$("exploreGrid")) return;

  const search =
    (
      $("searchInput")
        ?.value ||
      ""
    ).toLowerCase();

  const results =
    posts.filter(
      post =>
      (
        String(post.caption || "") +
        " " +
        (post.tags || []).join(" ") +
        " " +
        String(post.authorName || "")
      )
      .toLowerCase()
      .includes(search)
    );


  $("exploreGrid").innerHTML =
    results
      .map(
        post =>

        post.type === "image"

        ?

        `<img
          src="${esc(post.mediaUrl)}"
          alt="WorldVibe"
        >`

        :

        `<video
          src="${esc(post.mediaUrl)}"
          muted
          playsinline
        ></video>`
      )
      .join("")

    ||

    `
    <div class="notice">
      Nothing found.
    </div>
    `;

};


/* =========================
   LIKE
========================= */

window.toggleLike = async function(id){

  if(!user){

    openAuth();

    return;

  }


  const post =
    posts.find(
      x => x.id === id
    );

  if(!post) return;


  const alreadyLiked =
    (post.likedBy || [])
      .includes(user.uid);


  await updateDoc(
    doc(db,"posts",id),
    {

      likedBy:
        alreadyLiked

        ?

        arrayRemove(user.uid)

        :

        arrayUnion(user.uid),

      likes:
        increment(
          alreadyLiked ? -1 : 1
        )

    }
  );


  if(!alreadyLiked){

    await updateDoc(
      doc(
        db,
        "users",
        post.uid
      ),
      {
        likes:
          increment(1)
      }
    );

    if(post.uid !== user.uid){

      await addDoc(
        collection(
          db,
          "users",
          post.uid,
          "notifications"
        ),
        {

          text:
            "Someone liked your video ❤️",

          created:
            serverTimestamp()

        }
      );

    }

  }

};


/* =========================
   FOLLOW
========================= */

window.toggleFollow = async function(uid){

  if(!user || user.uid === uid){

    return;

  }


  const myRef =
    doc(
      db,
      "users",
      user.uid
    );

  const otherRef =
    doc(
      db,
      "users",
      uid
    );


  const me =
    await getDoc(myRef);

  const following =
    me.data()?.following || [];


  const alreadyFollowing =
    following.includes(uid);


  await updateDoc(
    myRef,
    {

      following:
        alreadyFollowing

        ?

        arrayRemove(uid)

        :

        arrayUnion(uid)

    }
  );


  await updateDoc(
    otherRef,
    {

      followers:
        alreadyFollowing

        ?

        arrayRemove(user.uid)

        :

        arrayUnion(user.uid)

    }
  );


  if(!alreadyFollowing){

    await addDoc(
      collection(
        db,
        "users",
        uid,
        "notifications"
      ),
      {

        text:
          "You have a new follower 👤",

        created:
          serverTimestamp(),

        from:
          user.uid

      }
    );

  }

};


/* =========================
   VIEW COUNT
========================= */

window.countView = async function(id){

  if(!user) return;


  const sessionKey =
    "worldvibe_view_" + id;


  if(
    sessionStorage.getItem(
      sessionKey
    )
  ){

    return;

  }


  sessionStorage.setItem(
    sessionKey,
    "1"
  );


  const post =
    posts.find(
      x => x.id === id
    );


  await updateDoc(
    doc(
      db,
      "posts",
      id
    ),
    {

      views:
        increment(1)

    }
  );


  if(post){

    await updateDoc(
      doc(
        db,
        "users",
        post.uid
      ),
      {

        views:
          increment(1)

      }
    );

  }

};


/* =========================
   COMMENTS
========================= */

window.openComments = async function(id){

  activePost = id;

  $("commentsModal")
    .classList.add("show");


  const commentQuery =
    query(
      collection(
        db,
        "posts",
        id,
        "comments"
      ),
      orderBy(
        "created",
        "asc"
      )
    );


  const snapshot =
    await getDocs(
      commentQuery
    );


  $("comments").innerHTML =
    snapshot.docs
      .map(
        item => {

          const data =
            item.data();

          return `

          <div class="notice">

            <b>
              ${esc(
                data.authorName ||
                "User"
              )}
            </b>

            <br>

            ${esc(
              data.text ||
              ""
            )}

          </div>

          `;

        }
      )
      .join("")

    ||

    `
    <p class="muted">
      No comments yet.
    </p>
    `;

};


window.addComment = async function(){

  if(!user){

    openAuth();

    return;

  }


  if(!activePost){

    return;

  }


  const text =
    $("commentText")
      .value
      .trim();


  if(!text) return;


  const username =
    user.email
      ?.split("@")[0]
      || "User";


  await addDoc(
    collection(
      db,
      "posts",
      activePost,
      "comments"
    ),
    {

      uid:
        user.uid,

      authorName:
        username,

      text:
        text,

      created:
        serverTimestamp()

    }
  );


  await updateDoc(
    doc(
      db,
      "posts",
      activePost
    ),
    {

      commentsCount:
        increment(1)

    }
  );


  const post =
    posts.find(
      x => x.id === activePost
    );


  if(
    post &&
    post.uid !== user.uid
  ){

    await addDoc(
      collection(
        db,
        "users",
        post.uid,
        "notifications"
      ),
      {

        text:
          "Someone commented on your video 💬",

        created:
          serverTimestamp(),

        from:
          user.uid

      }
    );

  }


  $("commentText")
    .value = "";


  openComments(activePost);

};


/* =========================

========================= */

window.sharePost = async function(id){

  const url =
    location.href
      .split("?")[0] +
    "?post=" +
    id;


  if(
    navigator.share
  ){

    await navigator.share({

      title:
        "WorldVibe",

      text:
        "Watch this on WorldVibe 🌍🎬",

      url:
        url

    });

  }else{

    try{

      await navigator.clipboard
        .writeText(url);

      alert(
        "Share link copied ✅"
      );

    }catch{

      alert(url);

    }

  }

};

/* =========================
   DELETE POST
========================= */

window.deletePost = async function(id){

  if(!user) return;


  const post =
    posts.find(
      x => x.id === id
    );


  if(
    !post ||
    post.uid !== user.uid
  ){

    return;

  }


  if(
    !confirm(
      "Delete this post?"
    )
  ){

    return;

  }


  await deleteDoc(
    doc(
      db,
      "posts",
      id
    )
  );

};


/* =========================
   MEDIA PREVIEW
========================= */

window.previewMedia = function(){

  const file =
    $("mediaFile")
      .files[0];


  if(!file){

    $("preview")
      .innerHTML = "";

    return;

  }


  if(
    file.type
      .startsWith("image/")
  ){

    const url =
      URL.createObjectURL(
        file
      );

    $("preview")
      .innerHTML =
      `
      <img
        class="media"
        src="${url}"
        alt="Preview"
      >
      `;

  }else{

    const url =
      URL.createObjectURL(
        file
      );

    $("preview")
      .innerHTML =
      `
      <video
        class="media"
        controls
        playsinline
        src="${url}"
      ></video>
      `;

  }

};


/* =========================
   PUBLISH POST
========================= */

window.publishPost = async function(){

  if(!user){

    openAuth();

    return;

  }


  const file =
    $("mediaFile")
      .files[0];


  if(!file){

    alert(
      "Select a video or image first."
    );

    return;

  }


  $("uploadStatus")
    .textContent =
    "Uploading...";


  try{

    const safeName =
      file.name
        .replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


    const storageRef =
      ref(
        storage,
        `posts/${user.uid}/${Date.now()}_${safeName}`
      );


    await uploadBytes(
      storageRef,
      file
    );


    const mediaUrl =
      await getDownloadURL(
        storageRef
      );


    const userSnapshot =
      await getDoc(
        doc(
          db,
          "users",
          user.uid
        )
      );


    const profile =
      userSnapshot.data()
      || {};


    const tags =
      $("tags")
        .value
        .split(/\s+/)
        .map(
          x =>
          x.replace(
            /^#/,
            ""
          )
        )
        .filter(Boolean);


    await addDoc(
      collection(
        db,
        "posts"
      ),
      {

        uid:
          user.uid,

        authorName:
          profile.name ||
          "WorldVibe User",

        authorHandle:
          profile.handle ||
          "@worldvibeuser",

        authorAvatar:
          profile.avatar ||
          "",

        caption:
          $("caption")
            .value
            .trim(),

        tags:
          tags,

        type:
          file.type
            .startsWith("image/")
            ? "image"
            : "video",

        mediaUrl:
          mediaUrl,

        likes:
          0,

        likedBy:
          [],

        commentsCount:
          0,

        views:
          0,

        allowComments:
          $("allowComments")
            .checked,

        created:
          serverTimestamp()

      }
    );


    $("uploadStatus")
      .textContent =
      "Published successfully ✅";


    $("caption")
      .value = "";

    $("tags")
      .value = "";

    $("mediaFile")
      .value = "";

    $("preview")
      .innerHTML = "";


  }catch(error){

    console.error(error);

    $("uploadStatus")
      .textContent =
      "Upload failed: " +
      error.message;

  }

};

/* =========================
   SAVE PROFILE
========================= */

window.saveProfile = async function(){

  if(!user) return;


  const updateData = {

    name:
      $("editName")
        .value
        .trim(),

    handle:
      $("editHandle")
        .value
        .trim(),

    bio:
      $("editBio")
        .value
        .trim()

  };


  const file =
    $("avatarFile")
      .files[0];


  if(file){

    const safeName =
      file.name
        .replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


    const avatarRef =
      ref(
        storage,
        `avatars/${user.uid}/${Date.now()}_${safeName}`
      );


    await uploadBytes(
      avatarRef,
      file
    );


    updateData.avatar =
      await getDownloadURL(
        avatarRef
      );

  }


  await updateDoc(
    doc(
      db,
      "users",
      user.uid
    ),
    updateData
  );


  closeModals();

  renderProfile();

};


/* =========================
   PROFILE
========================= */

async function renderProfile(){

  if(!user){

    $("profileName")
      .textContent =
      "WorldVibe User";

    $("profileHandle")
      .textContent =
      "@worldvibeuser";

    $("profileBio")
      .textContent =
      "Create • Connect • Discover";

    return;

  }


  try{

    const snapshot =
      await getDoc(
        doc(
          db,
          "users",
          user.uid
        )
      );


    const profile =
      snapshot.data()
      || {};


    $("profileName")
      .textContent =
      profile.name ||
      "WorldVibe User";


    $("profileHandle")
      .textContent =
      profile.handle ||
      "@worldvibeuser";


    $("profileBio")
      .textContent =
      profile.bio ||
      "Create • Connect • Discover";


    $("followers")
      .textContent =
      (profile.followers || [])
        .length;


    $("following")
      .textContent =
      (profile.following || [])
        .length;


    $("likes")
      .textContent =
      profile.likes || 0;


    $("views")
      .textContent =
      profile.views || 0;


    $("coins")
      .textContent =
      profile.coins || 0;


    $("earnings")
      .textContent =
      "$" +
      Number(
        profile.earnings || 0
      ).toFixed(2);


    if(profile.avatar){

      $("avatar")
        .src =
        profile.avatar;

    }else{

      $("avatar")
        .removeAttribute(
          "src"
        );

    }


    $("profileGrid")
      .innerHTML =
      posts
        .filter(
          post =>
          post.uid === user.uid
        )
        .map(
          post =>

          post.type === "image"

          ?

          `<img
            src="${esc(post.mediaUrl)}"
            alt="WorldVibe"
          >`

          :

          `<video
            src="${esc(post.mediaUrl)}"
            muted
            playsinline
          ></video>`
        )
        .join("");

  }catch(error){

    console.error(
      "Profile error:",
      error
    );

  }

}


/* =========================
   NOTIFICATIONS
========================= */

async function renderActivity(){

  if(!$("activityList"))
    return;


  if(!user){

    $("activityList")
      .innerHTML =
      `
      <div class="notice">
        Login to see notifications.
      </div>
      `;

    return;

  }


  try{

    const notificationQuery =
      query(
        collection(
          db,
          "users",
          user.uid,
          "notifications"
        ),
        orderBy(
          "created",
          "desc"
        ),
        limit(50)
      );


    const snapshot =
      await getDocs(
        notificationQuery
      );


    $("activityList")
      .innerHTML =
      snapshot.docs
        .map(
          item =>

          `
          <div class="notice">
            ${esc(
              item.data().text ||
              "Activity"
            )}
          </div>
          `
        )
        .join("")

      ||

      `
      <p class="muted">
        No notifications yet.
      </p>
      `;

  }catch(error){

    console.error(error);

    $("activityList")
      .innerHTML =
      `
      <div class="notice">
        Notifications are loading...
      </div>
      `;

  }

}
